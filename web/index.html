  function openEmp(login) { const fromFunnel = state.view === "funnel"; state.view = "emp"; state.login = login; location.hash = "emp-" + login; if (fromFunnel) renderShell(); load(); window.scrollTo(0, 0); }

  const isFunnelHash = (h) => h === "funnel" || h === "funnel-fact";
  let sideCache = {};
  async function load() {
    const main = document.getElementById("main");
    main.innerHTML = `<div class="empty">Загрузка…</div>`;
    const isMgr = state.boot.me.role === "manager";
    if (state.view === "staff") {
      try { renderStaff(await api("/api/staff")); }
      catch (e) { if (e.message !== "auth") main.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
      return;
    }
    if (state.view === "calls") { loadCalls(); return; }
    if (state.view === "workload") { loadWorkload(); return; }
    if (state.view === "money") { loadMoney(); return; }
    if (state.view === "suppliers") { loadSuppliers(); return; }
    if (METRICS[state.view]) { loadMetrics(); return; }
    if (state.view === "funnel") {
      try {
        const [dFrom, dTo] = funnelPeriod();
        const per = dFrom || dTo ? `&date_from=${dFrom}&date_to=${dTo}&date_field=${state.fDateField || "created"}` : "";
        const dep = state.fDep == null ? "" : `&department=${encodeURIComponent(state.fDep || "_none")}`;
        const q = (kind, cat) => api(`/api/funnel?kind=${kind}&mode=${state.fMode === "fact" ? "fact" : "date"}&login=${encodeURIComponent((state.fLogins || []).join(","))}&category=${encodeURIComponent(cat)}${per}${dep}`);
        const logins = (state.fLogins || []).join(",");
        const [leads, deals, calls] = await Promise.all([q("leads", ""), q("deals", state.fCat || ""),
          logins && !PREVIEW ? api(`/api/call-funnel?login=${encodeURIComponent(logins)}&date_from=${dFrom}&date_to=${dTo}`) : null]);
        renderFunnel({ leads, deals, calls });
      }
      catch (e) { if (e.message !== "auth") main.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
      return;
    }
    try {
      if (isMgr && (state.view === "team" || !sideCache[state.month])) {
        sideCache[state.month] = await api("/api/overview?month=" + state.month);
      }
      if (isMgr) renderSide(sideCache[state.month]);
      const who = state.boot.employees.find((e) => e.login === state.login);
      if (state.view === "team") renderTeam(sideCache[state.month]);
      else if (who && !who.position) renderNoKpi(who, isMgr);
      else renderEmp(await api(`/api/employee?login=${encodeURIComponent(state.login)}&month=${state.month}`));
    } catch (e) {
      if (e.message !== "auth") main.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
    }
  }

  // ---------- графики
  function sparkline(trend, w = 96, h = 26) {
    const pts = trend.map((t, i) => [4 + (i * (w - 8)) / Math.max(1, trend.length - 1), h - 4 - Math.min(1, t.share) * (h - 8)]);
    const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    const last = pts[pts.length - 1];
    return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Доля выплаченного KPI за 6 месяцев: ${trend.map((t) => pct(t.share)).join(", ")}">
      <line x1="4" x2="${w - 4}" y1="4" y2="4" stroke="var(--line)" stroke-dasharray="2 3"/>
      <path d="${d} L${last[0]} ${h - 4} L4 ${h - 4} Z" fill="var(--accent-soft)" stroke="none"/>
      <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/></svg>`;
  }

  function payoutChart(trend, bonus, currentMonth) {
    const W = 520, H = 190, L = 54, R = 8, T = 14, B = 26;
    const n = trend.length, bw = Math.min(46, ((W - L - R) / n) * 0.56), step = (W - L - R) / n;
    const y = (v) => T + (H - T - B) * (1 - v / bonus);
    const ticks = [0, 0.5, 1].map((k) => k * bonus);
    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Выплата KPI по месяцам">`;
    ticks.forEach((t) => { s += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" ${t ? 'stroke-dasharray="3 4"' : ""}/>
      <text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${nf(t)}</text>`; });
    trend.forEach((t, i) => {
      const x = L + step * i + (step - bw) / 2, v = Math.max(0, t.payout), top = y(v);
      const inProg = t.month === currentMonth;
      const hgt = Math.max(0, y(0) - top);
      const r = Math.min(4, hgt);
      if (hgt > 0) s += `<path d="M${x} ${y(0)} V${top + r} Q${x} ${top} ${x + r} ${top} H${x + bw - r} Q${x + bw} ${top} ${x + bw} ${top + r} V${y(0)} Z" fill="${inProg ? "var(--bar-2)" : "var(--bar)"}"/>`;
      else s += `<line x1="${x}" x2="${x + bw}" y1="${y(0) - 1}" y2="${y(0) - 1}" stroke="var(--bad)" stroke-width="2"/>`;
      s += `<text class="lbl" x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${mShort(t.month)}</text>`;
      s += `<rect x="${L + step * i}" y="${T}" width="${step}" height="${H - T - B}" fill="transparent" data-i="${i}"/>`;
    });
    s += `</svg><div class="tip" hidden></div>`;
    return s;
  }
  function bindChart(el, trend, currentMonth) {
    const tip = el.querySelector(".tip");
    el.querySelectorAll("rect[data-i]").forEach((r) => {
      const show = () => {
        const t = trend[+r.dataset.i], bb = r.getBoundingClientRect(), pb = el.getBoundingClientRect();
        tip.innerHTML = `${mLabel(t.month)}${t.month === currentMonth ? " (идёт)" : ""}<br><b>${rub(t.payout)}</b> · ${pct(t.share)} фонда`;
        tip.style.left = bb.left - pb.left + bb.width / 2 + "px"; tip.style.top = "8px"; tip.hidden = false;
      };
      r.addEventListener("mouseenter", show); r.addEventListener("click", show);
      r.addEventListener("mouseleave", () => (tip.hidden = true));
    });
  }

  // ---------- команда
  function renderTeam(ov) {
    const main = document.getElementById("main");
    const t = ov.totals, inProg = ov.month === state.boot.current_month;
    const rank = { critical: 0, warning: 1 };
    const alerts = ov.alerts.slice().sort((a, b) => (rank[a.level] ?? 2) - (rank[b.level] ?? 2));
    main.innerHTML = `
      <div class="head"><div><div class="eyebrow">Общий дашборд руководителя</div><h1>KPI команды · ${mLabel(ov.month)}</h1>
        <div class="sub">${inProg ? "Месяц ещё идёт: показано выполнение на сегодня, выплата по итогам месяца может измениться." : "Итоги месяца по правилам из регламентов KPI."}</div></div></div>
      <section class="stats">
        <div class="panel stat"><div class="eyebrow">К выплате по KPI</div><div class="v">${nf(t.payout)} <small>₽</small></div><div class="h">из фонда ${rub(t.fund)}</div></div>
        <div class="panel stat"><div class="eyebrow">Доля фонда</div><div class="v">${pct(t.payout / t.fund)}</div><div class="h">${t.employees} сотрудников</div></div>
        <div class="panel stat"><div class="eyebrow">Пунктов KPI выполнено</div><div class="v">${t.items_met} <small>из ${t.items}</small></div><div class="h">${pct(t.items_met / t.items)} всех пунктов</div></div>
        <div class="panel stat"><div class="eyebrow">KPI полностью</div><div class="v">${t.full} <small>из ${t.employees}</small></div><div class="h">получают 100% премии</div></div>
      </section>
      ${alerts.length ? `<section class="panel"><div class="panel-h"><h2>Требует внимания</h2><span class="muted small">${alerts.length}</span></div>
        <div class="panel-b alerts">${alerts.slice(0, 8).map((a) => `<div class="alert ${a.level}"><span class="ic" aria-hidden="true">${a.level === "info" ? "i" : "!"}</span>
        <div><a href="#emp-${a.login}" data-login="${a.login}">${esc(a.name)}</a> — ${esc(a.text)}</div></div>`).join("")}
        ${alerts.length > 8 ? `<div class="muted small">и ещё ${alerts.length - 8}</div>` : ""}</div></section>` : ""}
      ${ov.groups.map((g) => `<section class="panel">
        <div class="panel-h"><div><div class="eyebrow">${esc(g.department)}</div><h2>${esc(g.title)}</h2></div>
          <span class="muted small">оклад ${rub(state.boot.positions[g.position].salary)} + KPI ${rub(state.boot.positions[g.position].kpi_bonus)}</span></div>
        <div class="scroll"><table class="matrix"><thead><tr><th>Сотрудник</th>
          ${g.columns.map((c) => `<th>KPI ${c.n} · ${Math.round(c.weight * 100)}%<span class="kt">${esc(c.title)}</span></th>`).join("")}
          <th>К выплате</th><th>6 мес.</th></tr></thead><tbody>
          ${g.employees.map((e) => `<tr data-login="${e.login}" tabindex="0"><td class="who">${esc(e.name)}</td>
            ${e.items.map((i) => { const k = statusKey(i.status); return `<td><div class="cell c-${k}" title="${esc(i.title)}: ${esc((STATUS[i.status] || [""])[0])}">
              <span class="p">${i.pct == null ? (i.status === "awaiting" ? "оценка" : "—") : pct(i.pct)}</span>
              <span class="bar"><i style="width:${i.pct == null ? 0 : Math.min(100, i.pct * 100)}%"></i></span>
              <span class="r">${i.payout ? rub(i.payout) : "0 ₽"} / ${nf(i.amount)}</span></div></td>`; }).join("")}
            <td><span class="total ${e.zero_all.length ? "zero" : ""}">${rub(e.payout)}</span><div class="muted small">${e.absent ? "не работал(а)" : e.zero_all.length ? "обнулено" : pct(e.share) + " фонда"}</div></td>
            <td>${sparkline(e.trend)}</td></tr>`).join("")}
        </tbody></table></div></section>`).join("")}
      <p class="muted small">Ячейка: процент выполнения норматива пункта (100% — норма выполнена), под ним начислено / максимум по пункту. Выплата: ${state.boot.payout_mode === "binary" ? "пункт оплачивается полностью при выполнении нормы" : "пропорционально выполнению"}. Нажмите на строку, чтобы открыть дашборд сотрудника.</p>`;
    main.querySelectorAll("tr[data-login]").forEach((tr) => {
      tr.addEventListener("click", () => openEmp(tr.dataset.login));
      tr.addEventListener("keydown", (e) => { if (e.key === "Enter") openEmp(tr.dataset.login); });
    });
    main.querySelectorAll("a[data-login]").forEach((a) => a.addEventListener("click", (ev) => { ev.preventDefault(); openEmp(a.dataset.login); }));
  }

  // ---------- сотрудник
  function compRow(c, inProg) {
    let cls = "na";
    if (c.pct != null) cls = c.informative ? "info" : c.pct >= 0.9999 ? "ok" : inProg ? "info" : c.pct >= 0.8 ? "mid" : "bad";
    // шкала: норма в точке 100%/scale; для «меньше — лучше» показываем долю нормы
    let fillW = 0, goalX = null, paceX = null;
    if (c.fact != null && c.target != null) {
      if (c.op === "<=") {
        const max = Math.max(c.target * 1.5, c.fact, 1e-9);
        fillW = (c.fact / max) * 100; goalX = (c.target / max) * 100;
      } else {
        const max = Math.max(c.target * 1.25, c.fact, 1e-9);
        fillW = (c.fact / max) * 100; goalX = (c.target / max) * 100;
        if (c.pace != null) paceX = (c.pace / max) * 100;
      }
    }
    return `<div class="comp ${cls}"><div class="n">${esc(c.name)}<span class="src">· ${esc(c.source || "")}</span></div>
      <div class="v">${fmtVal(c.fact, c.unit)} <span class="t">${fmtTarget(c)}</span></div>
      <div class="track" role="img" aria-label="${esc(c.name)}: ${fmtVal(c.fact, c.unit)}, ${fmtTarget(c)}">
        <div class="fill" style="width:${Math.min(100, fillW).toFixed(1)}%"></div>
        ${goalX != null ? `<div class="goal" style="left:calc(${goalX.toFixed(1)}% - 1px)" title="Норма"></div>` : ""}
        ${paceX != null ? `<div class="pace" style="left:calc(${paceX.toFixed(1)}% - 1px)" title="Темп на сегодня: ${fmtVal(c.pace, c.unit)}"></div>` : ""}
      </div>${c.pace != null ? `<div class="small muted" style="grid-column:1/-1">Темп на сегодня: ${fmtVal(c.pace, c.unit)}</div>` : ""}</div>`;
  }

  function manualBlock(d, it) {
    const isMgr = state.boot.me.role === "manager";
    const crit = it.manual.criteria, titles = state.boot.criteria_titles;
    const opts = (v) => ["", 100, 75, 50, 25, 0].map((o) => `<option value="${o}" ${String(v ?? "") === String(o) ? "selected" : ""}>${o === "" ? "—" : o}</option>`).join("");
    return `<div class="manual"><div class="eyebrow">Еженедельная оценка руководителя</div>
      <div class="scroll"><table><thead><tr><th>Неделя с</th>${crit.map((c) => `<th>${esc(titles[c])}</th>`).join("")}<th>Комментарий</th></tr></thead><tbody>
      ${d.weeks.map((w, wi) => `<tr><td class="num">${dLabel(w)}</td>${crit.map((c) => {
        const s = it.manual.weeks[c][wi];
        return `<td>${isMgr ? `<select aria-label="${esc(titles[c])}, неделя с ${dLabel(w)}" data-score data-week="${w}" data-crit="${c}">${opts(s.score)}</select>` : `<span class="num">${s.score ?? "—"}</span>`}</td>`;
      }).join("")}<td>${(() => { const cm = crit.map((c) => it.manual.weeks[c][wi].comment).filter(Boolean).join("; ");
        return isMgr ? `<input type="text" aria-label="Комментарий, неделя с ${dLabel(w)}" data-comment data-week="${w}" value="${esc(cm)}" placeholder="замечания">` : `<span class="small">${esc(cm) || "—"}</span>`; })()}</td></tr>`).join("")}
      </tbody></table></div>${isMgr ? `<div class="small muted">100 — без замечаний. Пункт выполнен, если средняя оценка за месяц 100.</div>` : ""}</div>`;
  }

  // ручной ввод к записям из 1С: срок и дата оплаты реализаций, брак, отсрочка, признаки конкурентной закупки
  function entryBlock(d, it) {
    const en = it.entry, isMgr = state.boot.me.role === "manager";
    if (!en.rows.length) return `<div class="manual"><div class="eyebrow">Данные для ввода</div><div class="small muted">За ${MONTHS[+d.month.slice(5) - 1].toLowerCase()} записей из 1С нет.</div></div>`;
    const show = (f, v) => v == null ? "—" : f.type === "bool" ? (v ? "да" : "нет") : f.type === "pct" ? nf(v * 100, 0) + "%" : f.type === "date" ? v : nf(v);
    const input = (r, f) => {
      const v = r.values[f.key], lbl = `${esc(f.title)}, ${esc(r.cells[0])}`;
      const data = `data-entry data-table="${en.table}" data-ref="${esc(r.ref)}" data-field="${f.key}" aria-label="${lbl}"`;
      if (f.type === "bool") return `<select ${data}><option value="" ${v == null ? "selected" : ""}>—</option><option value="1" ${v === 1 ? "selected" : ""}>да</option><option value="0" ${v === 0 ? "selected" : ""}>нет</option></select>`;
      if (f.type === "date") return `<input type="date" ${data} value="${esc(v || "")}">`;
      if (f.type === "text") return `<input type="text" ${data} value="${esc(v ?? "")}" style="min-width:90px">`;
      const shown = v == null ? "" : f.type === "pct" ? Math.round(v * 1000) / 10 : v;
      return `<input type="number" min="0" ${f.type === "pct" ? 'max="100" step="1"' : 'step="1"'} ${data} value="${shown}" style="width:80px">`;
    };
    return `<div class="manual"><div class="eyebrow">${isMgr ? "Ввод руководителя к данным 1С" : "Данные, введённые руководителем"}</div>
      <div class="scroll"><table><thead><tr>${en.columns.map((c) => `<th>${esc(c)}</th>`).join("")}${en.fields.map((f) => `<th>${esc(f.title)}</th>`).join("")}</tr></thead><tbody>
      ${en.rows.map((r) => `<tr>${r.cells.map((c, ci) => `<td class="${typeof c === "number" ? "num nw" : ci < 2 ? "nw" : ""}">${typeof c === "number" ? nf(Math.round(c)) : esc(c ?? "—")}</td>`).join("")}${en.fields.map((f) =>
        `<td${r.manual.includes(f.key) ? ' class="manual-set" title="Введено вручную"' : ""}>${isMgr ? input(r, f) : show(f, r.values[f.key])}</td>`).join("")}</tr>`).join("")}
      </tbody></table></div>${isMgr ? `<div class="small muted">Сохраняется сразу. Подчёркнутые значения введены вручную и не стираются при обновлении из 1С; пустое поле — значение из 1С или нет данных.</div>` : ""}</div>`;
  }

  // штрафы за нарушение финансовой дисциплины: вносит руководитель; «штрафов нет» — явная отметка за месяц
  function penaltyBlock(d, it) {
    const pb = it.penalties, isMgr = state.boot.me.role === "manager";
    const mon = MONTHS[+d.month.slice(5) - 1].toLowerCase();
    const list = pb.rows.length ? `<div class="scroll"><table><thead><tr><th>Дата</th><th>Сумма, ₽</th><th>Основание</th>${isMgr ? "<th></th>" : ""}</tr></thead><tbody>
      ${pb.rows.map((r) => `<tr><td class="nw">${esc(r.dt)}</td><td class="num nw">${nf(r.amount)}</td><td>${esc(r.reason || "—")}</td>${isMgr ? `<td><button class="btn" type="button" data-pen-del="${r.id}">Удалить</button></td>` : ""}</tr>`).join("")}
      </tbody></table></div>` : `<div class="small">${pb.checked ? `За ${mon} штрафов нет (отмечено руководителем).` : `За ${mon} штрафы не внесены.`}</div>`;
    if (!isMgr) return `<div class="manual"><div class="eyebrow">Штрафы за нарушение финансовой дисциплины</div>${list}</div>`;
    const day = d.month === state.boot.current_month ? new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10) : d.month + "-01";
    return `<div class="manual"><div class="eyebrow">Штрафы за нарушение финансовой дисциплины</div>${list}
      <form class="inline-form" data-pen-add><label for="pen-dt">Дата</label><input id="pen-dt" type="date" value="${day}" min="${d.month}-01" max="${d.month}-31" required>
        <label for="pen-sum">Сумма, ₽</label><input id="pen-sum" type="number" min="0" step="1" style="width:110px">
        <label for="pen-why">Основание</label><input id="pen-why" type="text" maxlength="300" placeholder="за что">
        <button class="btn" type="submit">Добавить штраф</button></form>
      ${pb.rows.length ? "" : `<label class="small"><input type="checkbox" data-pen-check ${pb.checked ? "checked" : ""}> За ${mon} штрафов нет</label>`}
      <div class="small muted">Пока за месяц не внесён штраф или не отмечено «штрафов нет», пункт ждёт ввода.</div></div>`;
  }

  function renderEmp(d) {
    const main = document.getElementById("main");
    const b = state.boot, isMgr = b.me.role === "manager", inProg = d.in_progress;
    const zeroed = d.zero_all.length > 0;
    main.innerHTML = `
      <div class="head"><div><div class="eyebrow">${esc(d.department)} · ${esc(d.position_title)}</div><h1>${esc(d.name)}</h1>
        <div class="sub">${mLabel(d.month)} · ${inProg ? `идёт ${d.working_days_elapsed}-й рабочий день из ${d.working_days}` : `${d.working_days} рабочих дней`}</div></div>
        ${isMgr ? `<button class="btn" type="button" id="backBtn">← Вся команда</button>` : ""}</div>
      <section class="panel hero">
        <div><div class="eyebrow">${inProg ? "Начислено на сегодня" : "KPI к выплате"}</div>
          <div class="big" style="margin-top:8px;${zeroed ? "color:var(--bad)" : ""}">${nf(d.payout)} <small>₽ из ${nf(d.kpi_bonus)}</small></div>
          <div class="weights" role="img" aria-label="Структура KPI по пунктам">${d.items.map((i) => `<div class="seg ${zeroed && i.payout ? "zeroed" : i.payout ? "met" : ""}" style="flex:${i.weight}" title="KPI ${i.n}. ${esc(i.title)} — ${rub(i.payout)} из ${rub(i.amount)}">${i.n}</div>`).join("")}</div>
          <div class="legend"><span><i style="background:var(--good)"></i>начислено</span><span><i style="border:1.5px solid var(--line-strong)"></i>не начислено</span>${zeroed ? `<span><i style="background:repeating-linear-gradient(135deg,var(--bad-soft) 0 3px,var(--surface) 3px 6px);border:1.5px solid var(--bad)"></i>обнулено</span>` : ""}<span>ширина — вес пункта</span></div>
          ${zeroed ? d.zero_all.map((z) => `<div class="zero-note" style="margin-top:10px">${esc(z)}</div>`).join("") : ""}
          ${d.absence && d.absence.days ? `<div class="muted small" style="margin-top:10px">${d.absent ? "Весь месяц не работал(а), KPI не считается" : `Не работал(а) ${d.absence.days} из ${d.working_days} рабочих дней`}: ${esc(d.absence.periods.join(", "))}</div>` : ""}
          ${d.absence && d.absence.truancy_days ? `<div class="small" style="margin-top:6px;color:var(--bad)">Прогулы: ${d.absence.truancy_days} раб. дн. — от норм не освобождают (${esc(d.absence.truancy.join(", "))})</div>` : ""}
          <div class="kv"><div><span class="eyebrow">Оклад</span><b>${rub(d.salary)}</b></div><div><span class="eyebrow">Пунктов выполнено</span><b>${d.met_count} из ${d.item_count}</b></div><div><span class="eyebrow">Итого с окладом</span><b>${rub(d.salary + d.payout)}</b></div></div>
        </div>
        <div><div class="eyebrow">Выплата KPI за 6 месяцев, ₽</div><div class="chart" id="payChart">${payoutChart(d.trend, d.kpi_bonus, b.current_month)}</div></div>
      </section>
      <section class="cards">${d.items.map((i) => {
        const st = STATUS[i.status] || STATUS.nodata;
        const ex = i.extra || [];
        return `<article class="panel card">
          <div class="card-h"><div class="meta">KPI ${i.n} · вес ${Math.round(i.weight * 100)}% · ${nf(i.amount)} ₽ · ${esc(i.period)}</div>
            <div class="card-score"><div class="p">${i.pct == null ? "—" : pct(i.pct)}</div><div class="r">${rub(i.payout)}</div></div>
            <h3>${esc(i.title)}</h3><div class="tgt"><span class="chip ${st[1]}">${st[0]}</span> &nbsp;${esc(i.target_text)}</div></div>
          <div class="card-b">${i.components.map((c) => compRow(c, inProg)).join("")}
            ${i.plan && isMgr ? `<form class="inline-form" data-plan="${i.plan.metric}"><label for="plan-${i.n}">План на ${MONTHS[+d.month.slice(5) - 1].toLowerCase()}, ₽</label><input id="plan-${i.n}" type="number" min="0" step="10000" value="${i.plan.value ?? ""}"><button class="btn" type="submit">Сохранить план</button>${i.plan.is_default ? `<span class="muted">сейчас — план по умолчанию</span>` : ""}</form>` : ""}
            ${i.code === "conversion_sales" && i.baseline && isMgr ? `<form class="inline-form" data-baseline><label for="base-${i.n}">Средняя конверсия прошлого года, %</label><input id="base-${i.n}" type="number" min="0" max="100" step="0.1"><button class="btn" type="submit">Сохранить</button></form>` : ""}
            ${i.manual ? manualBlock(d, i) : ""}
            ${i.entry ? entryBlock(d, i) : ""}
            ${i.penalties ? penaltyBlock(d, i) : ""}
            ${ex.length ? `<div class="extra">${ex.map((x) => `<div>${esc(x.label)}: <b>${fmtExtra(x)}</b>${x.hint ? ` <span class="muted">(${esc(x.hint)})</span>` : ""}</div>`).join("")}</div>` : ""}
          </div>
          <details class="more"><summary>Как считается и из чего${i.details && i.details.rows.length ? ` · ${i.details.rows.length} записей` : ""}</summary><div class="more-b">
            <div class="desc">${esc(i.description)}</div>
            ${i.funnel ? `<div><div class="eyebrow" style="margin-bottom:6px">${esc(i.funnel.title)}</div><div class="funnel">${(() => { const mx = Math.max(1, ...i.funnel.steps.map((s) => s[1])); return i.funnel.steps.map((s) => `<div class="row"><span>${esc(s[0])}</span><div class="fb" style="width:${Math.max(1, (s[1] / mx) * 100)}%"></div><b>${nf(s[1])}</b></div>`).join(""); })()}</div></div>` : ""}
            ${i.details && i.details.rows.length ? `<div class="dt-wrap"><table class="dt"><thead><tr>${i.details.columns.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>
              ${i.details.rows.map((r) => `<tr>${r.map((v, ci) => `<td class="${typeof v === "number" ? "n" : ""}">${fmtCell(v, i.details.columns[ci], (i.details.pct_cols || []).includes(ci))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : `<div class="muted small">Записей за период нет.</div>`}
          </div></details></article>`;
      }).join("")}</section>`;
    bindChart(document.getElementById("payChart"), d.trend, b.current_month);
    const back = document.getElementById("backBtn");
    if (back) back.addEventListener("click", () => { state.view = "team"; location.hash = "team"; load(); });
    main.querySelectorAll("select[data-score]").forEach((s) => s.addEventListener("change", async () => {
      const row = s.closest("tr"), cm = row.querySelector("[data-comment]");
      try {
        await api("/api/score", { emp: d.login, week: s.dataset.week, criterion: s.dataset.crit, score: s.value === "" ? null : +s.value, comment: cm ? cm.value : "" });
        if (!PREVIEW) { toast("Оценка сохранена, KPI пересчитан"); sideCache = {}; load(); }
      } catch (e) { toast(e.message); }
    }));
    main.querySelectorAll("input[data-comment]").forEach((inp) => inp.addEventListener("change", async () => {
      const row = inp.closest("tr");
      const sels = row.querySelectorAll("select[data-score]");
      try {
        for (const s of sels) if (s.value !== "") await api("/api/score", { emp: d.login, week: s.dataset.week, criterion: s.dataset.crit, score: +s.value, comment: inp.value });
        if (!PREVIEW) toast("Комментарий сохранён");
      } catch (e) { toast(e.message); }
    }));
    const penalty = async (body, msg) => {
      try { await api("/api/penalty", { emp: d.login, month: d.month, ...body }); if (!PREVIEW) { toast(msg); sideCache = {}; load(); } }
      catch (e) { toast(e.message); }
    };
    main.querySelectorAll("form[data-pen-add]").forEach((f) => f.addEventListener("submit", (ev) => {
      ev.preventDefault();
      penalty({ action: "add", dt: f.querySelector("#pen-dt").value, amount: f.querySelector("#pen-sum").value,
                reason: f.querySelector("#pen-why").value }, "Штраф добавлен, KPI пересчитан");
    }));
    main.querySelectorAll("[data-pen-del]").forEach((b) => b.addEventListener("click", () => {
      if (confirm("Удалить штраф?")) penalty({ action: "delete", id: b.dataset.penDel }, "Штраф удалён, KPI пересчитан");
    }));
    main.querySelectorAll("[data-pen-check]").forEach((c) => c.addEventListener("change", () =>
      penalty({ action: "check", checked: c.checked }, c.checked ? "Отмечено: штрафов нет" : "Отметка снята")));
    main.querySelectorAll("[data-entry]").forEach((el) => el.addEventListener("change", async () => {
      try {
        await api("/api/manual", { table: el.dataset.table, ref: el.dataset.ref, field: el.dataset.field, value: el.value });
        if (!PREVIEW) { toast("Сохранено, KPI пересчитан"); sideCache = {}; load(); }
      } catch (e) { toast(e.message); }
    }));
    main.querySelectorAll("form[data-plan]").forEach((f) => f.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      try { await api("/api/plan", { emp: d.login, month: d.month, metric: f.dataset.plan, value: +f.querySelector("input").value }); if (!PREVIEW) { toast("План сохранён"); sideCache = {}; load(); } }
      catch (e) { toast(e.message); }
    }));
    main.querySelectorAll("form[data-baseline]").forEach((f) => f.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      try { await api("/api/baseline", { emp: d.login, metric: "conversion_last_year", value: +f.querySelector("input").value / 100 }); if (!PREVIEW) { toast("Базовый уровень сохранён"); sideCache = {}; load(); } }
      catch (e) { toast(e.message); }
    }));
  }

  // ---------- звонки: записи разговоров и журнал прослушиваний
  const DIR = { out: "Исходящий", in: "Входящий" };
  // раздел «Метрики» (только руководителю): вид → адрес и страница
  const METRICS = { "m-sales": { hash: "metrics-sales", title: "Продажи", kind: "sales" },
                    "m-supply": { hash: "metrics-supply", title: "Снабжение", kind: "supply" },
                    "m-logistics": { hash: "metrics-logistics", title: "Логистика", kind: "logistics" } };
  const metricsView = (h) => Object.keys(METRICS).find((v) => METRICS[v].hash === h);
  const dur = (s) => `${Math.floor((s || 0) / 60)}:${String((s || 0) % 60).padStart(2, "0")}`;
  const dtLabel = (v) => (v || "").slice(0, 16).replace("T", " ").replace(/^(\d{4})-(\d{2})-(\d{2})/, "$3.$2.$1");
  // разбор звонка Claude: тип, отметки «предложение» и «договорённость»; суть — во всплывающей подсказке
  let anWhen = "не обработан";
  const anCell = (c) => {
    const a = c.analysis;
    const mgr = state.boot.me.role === "manager" && c.audio === "ready";
    const proc = (label, title) => mgr ? `<button class="btn ghost an-proc" type="button" data-proc="${esc(c.id)}" title="${title}">${label}</button>` : "";
    if (!a) return c.transcript === "ready" ? `<span class="muted small">${anWhen}</span>${proc("Обработать", "Расшифровать (если нужно) и разобрать звонок сейчас")}`
      : c.audio === "ready" ? proc("Обработать", "Расшифровать и разобрать звонок сейчас") || `<span class="muted">—</span>` : `<span class="muted">—</span>`;
    return `${proc("↻", "Обработать заново").replace("an-proc", "an-proc re")}<span class="an" title="${esc(a.summary || "")}"><span class="an-type">${esc(a.call_type || "—")}</span>${a.offer ? `<span class="an-flag ok">предложение</span>` : ""}${a.agreement ? `<span class="an-flag ok">договорённость</span>` : ""}${a.secretary ? `<span class="an-flag warn" title="${a.secretary_manual ? "Отметил руководитель" : "Определил Claude"}: разговор только с секретарём — в KPI не результативный">секретарь</span>` : ""}</span>`;
  };
  function analysisHtml(a, id) {  // полный разбор над расшифровкой; id — звонок (для отметки «секретарь»)
    if (!a) return `<div class="muted small">Разбора пока нет: он появится после расшифровки, в фоне.</div>`;
    const isMgr = state.boot.me.role === "manager", man = a.secretary_manual, ai = a.secretary_ai;
    const secr = man ?? ai;
    const secrText = secr == null ? `<span class="muted">не определено — разбор старой версии</span>`
      : (secr ? '<b class="secr">секретарь</b> — до нужного человека не дошли' : "нужный человек") +
        ` <span class="muted small">(${man != null ? "отметил руководитель" : "определил Claude"})</span>`;
    const secrCtl = isMgr && id ? ` <select data-secr="${esc(id)}" aria-label="Отметка «секретарь»"><option value="" ${man == null ? "selected" : ""}>как определил Claude</option><option value="1" ${man === 1 ? "selected" : ""}>секретарь</option><option value="0" ${man === 0 ? "selected" : ""}>не секретарь</option></select>` : "";
    const yn = (v) => v ? `<b class="yes">да</b>` : `<b class="no">нет</b>`;
    const list = (xs, f) => (xs || []).length ? xs.map((x) => esc(f(x))).join("<br>") : "—";
    const o = a.offer || {}, g = a.agreement || {}, tone = a.tone || {};
    return `<table class="an-table"><tbody>
      <tr><th>Тип</th><td>${esc(a.call_type || "—")}</td></tr>
      <tr><th>Суть</th><td>${esc(a.summary || "—")}</td></tr>
      <tr><th>Предложение</th><td>${yn(o.made)} ${esc(o.what || "")}${o.kp_promised ? " · обещано КП" : ""}${o.price_named ? " · названа цена" : ""}</td></tr>
      <tr><th>Договорённость</th><td>${yn(g.reached)} ${esc(g.what || "")}${g.when ? ` · срок: ${esc(g.when)}` : ""}</td></tr>
      <tr><th>Собеседник</th><td>${secrText}${secrCtl}</td></tr>
      ${(a.prices || []).length ? `<tr><th>Цены</th><td>${list(a.prices, (x) => `${x.value} — ${x.what}`)}</td></tr>` : ""}
      ${(a.deadlines || []).length ? `<tr><th>Сроки</th><td>${list(a.deadlines, (x) => `${x.value} — ${x.what}`)}</td></tr>` : ""}
      ${(a.objections || []).length ? `<tr><th>Возражения</th><td>${list(a.objections, (x) => `${x.type}: ${x.text}`)}</td></tr>` : ""}
      ${tone.client ? `<tr><th>Тон</th><td>клиент — ${esc(tone.client)}, сотрудник — ${esc(tone.manager || "—")}</td></tr>` : ""}
      ${a.next_step ? `<tr><th>Следующий шаг</th><td>${esc(a.next_step)}</td></tr>` : ""}
    </tbody></table>`;
  }
  const ROLE = { "М": "Сотрудник", "К": "Собеседник", "А": "Автоответчик" };

  // фильтры «Звонков» отличаются от исходных: текущий месяц, все сотрудники, без сделки, по дате от новых
  function callsFiltered() {
    const p = state.cPer, s = state.cSort;
    return !!(state.cLogin || (state.cDeal || "").trim() || (p && !(p.mode === "month" && p.month === state.boot.current_month))
              || (s && !(s.key === "dt" && s.dir === -1)));
  }
  async function loadCalls() {
    const main = document.getElementById("main"), isMgr = state.boot.me.role === "manager";
    try {
      const login = state.cLogin ?? "";
      const deal = (state.cDeal || "").trim();
      if (!state.cPer) state.cPer = { mode: "month", month: state.boot.current_month };
      if (state.cPg) state.cPg.page = 0;  // новые фильтры или данные — снова с первой страницы
      const [a, b] = periodRange(state.cPer);
      const per = a || b ? `&date_from=${a}&date_to=${b}` : "&all=1";
      state.cQs = `login=${encodeURIComponent(login)}${per}${deal ? "&deal=" + encodeURIComponent(deal) : ""}`;
      const d = await api(`/api/calls?${state.cQs}`);
      const log = isMgr && state.cLogOpen ? await api(`/api/listen-log?date_from=${state.cLogFrom || ""}&date_to=${state.cLogTo || ""}`) : null;
      renderCalls(d, log);
    } catch (e) { if (e.message !== "auth") main.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }
  function renderCalls(d, log) {
    const main = document.getElementById("main"), b = state.boot, isMgr = b.me.role === "manager";
    const audio = (c) => {
      if (c.audio === "ready") return c.can_listen ? `<span class="rec-cell"><button class="btn" type="button" data-play="${esc(c.id)}">▶ Слушать</button>${c.transcript === "ready"
        ? ` <button class="btn ghost" type="button" data-text="${esc(c.id)}" aria-expanded="false">Текст</button>` : c.transcript === "pending" ? ` <span class="muted small">текст готовится…</span>` : ""}</span>` : `<span class="muted">прослушивание недоступно</span>`;
      if (c.audio === "purged") return `<span class="muted">удалена по сроку хранения</span>`;
      if (c.audio === "error") return `<span style="color:var(--bad)">не удалось скачать</span>`;
      return `<span class="muted">скачивается…</span>`;
    };
    const deals = (c) => !c.deals.length ? "—" : c.deals.slice(0, 3).map((id) => d.portal
      ? `<a href="${esc(d.portal)}/crm/deal/details/${id}/" target="_blank" rel="noopener">${id}</a>` : String(id)).join(", ") +
      (c.deals.length > 3 ? ` <span class="muted" title="${c.deals.slice(3).join(", ")}">+${c.deals.length - 3}</span>` : "");
    const emps = d.employees, multi = emps.length > 1;
    const title = d.deal != null ? `по сделке ${d.deal}` : periodLabel(d.date_from, d.date_to);
    // сортировка щелчком по заголовку; при равенстве — новые звонки выше
    const sort = state.cSort || { key: "dt", dir: -1 };
    const SORT_KEYS = { dt: (c) => c.dt, emp: (c) => c.emp_name || "", direction: (c) => DIR[c.direction] || "", duration: (c) => c.duration || 0 };
    const cmp = (a, b) => (typeof a === "number" ? a - b : String(a).localeCompare(String(b), "ru"));
    const calls = [...d.calls].sort((a, b) => sort.dir * cmp(SORT_KEYS[sort.key](a), SORT_KEYS[sort.key](b)) || cmp(b.dt, a.dt));
    const cpg = (state.cPg = state.cPg || {}), pgc = pgInfo(cpg, calls.length);
    const needs = (c) => c.audio === "ready" && (!c.analysis || c.transcript !== "ready");  // звонок ждёт расшифровки или разбора
    const todoAll = d.calls.filter(needs).length;
    if (!state.cSel) state.cSel = new Set();
    const ready = calls.filter((c) => c.audio === "ready");
    for (const id of [...state.cSel]) if (!ready.some((c) => c.id === id)) state.cSel.delete(id);  // выбор только среди звонков списка
    const picked = state.cSel.size;
    const MODELS = [["claude-opus-5-5", "Opus 5.5"], ["claude-sonnet-5-5", "Sonnet 5.5"], ["claude-haiku-5-5", "Haiku 5.5"]];
    const EFFORTS = [["low", "Низкий"], ["medium", "Средний"], ["high", "Высокий"], ["xhigh", "Сверхвысокий"], ["max", "Максимальный"]];
    const pick = (key, list, def) => { let v; try { v = localStorage.getItem(key); } catch (e) {} return list.some((x) => x[0] === v) ? v : def; };
    const save = (key, v) => { try { localStorage.setItem(key, v); } catch (e) {} };
    const modelMenu = () => {
      const m = pick("callModel", MODELS, "claude-sonnet-5-5"), ef = pick("callEffort", EFFORTS, "medium");
      return `<details class="proc" id="cModel"><summary class="btn ghost" title="Модель разбора звонков">${MODELS.find((x) => x[0] === m)[1]}</summary><div class="proc-pop mdl-pop">
        ${MODELS.map(([id, name], i) => `<button type="button" data-model="${id}"><span class="ck">${id === m ? "✓" : ""}</span>${name}<span class="k">${i + 1}</span></button>`).join("")}<hr>
        <div class="mdl-eff">Чем выше уровень усилий, тем более тщательные ответы — но это занимает больше времени и быстрее расходует лимит подписки.</div>
        ${EFFORTS.map(([id, name]) => `<button type="button" data-effort="${id}"><span class="ck">${id === ef ? "✓" : ""}</span>${name}${id === "medium" ? ` <span class="rec">Рекомендуется</span>` : ""}</button>`).join("")}</div></details>`;
    };
    const claudeResults = () => {  // итоги разбора Claude по звонкам списка: типы, предложения, договорённости, секретарь
      const an = calls.filter((c) => c.analysis), n = an.length;
      if (!n) return `<div class="ares"><h3>Результаты обработки Claude</h3><div class="muted small">За период обработанных звонков нет${state.boot.me.role === "manager" ? " — запустите «Обработать…»" : ""}.</div></div>`;
      const cnt = (f) => an.filter(f).length, pct = (v) => `${nf(v)} (${nf(v / n * 100)}%)`;
      const types = {}; an.forEach((c) => { const t = c.analysis.call_type || "не определён"; types[t] = (types[t] || 0) + 1; });
      const rows = Object.entries(types).sort((a, b) => b[1] - a[1]), top = rows[0][1];
      return `<div class="ares"><h3>Результаты обработки Claude</h3>
        <div class="ares-kpi"><div><b>${nf(n)}</b><span>обработано из ${nf(calls.length)}</span></div><div><b>${nf(cnt((c) => c.analysis.offer))}</b><span>с предложением</span></div>
          <div><b>${nf(cnt((c) => c.analysis.agreement))}</b><span>с договорённостью</span></div><div><b>${nf(cnt((c) => c.analysis.secretary))}</b><span>только секретарь</span></div></div>
        ${rows.map(([t, v]) => `<div class="ares-row"><span>${esc(t)}</span><span class="ares-bar"><i style="width:${v / top * 100}%"></i></span><span class="n">${pct(v)}</span></div>`).join("")}</div>`;
    };
    const callsChart = () => {  // звонки по дням (длинный период — по месяцам): исходящие и входящие
      if (!calls.length) return "";
      const days = calls.map((c) => c.dt.slice(0, 10)).sort(), first = days[0], last = days[days.length - 1];
      const span = (new Date(last) - new Date(first)) / 864e5 + 1, byMonth = span > 62;
      const keys = [], put = (k) => { if (!keys.includes(k)) keys.push(k); };
      if (byMonth) { let [y, m] = first.split("-").map(Number); const [ly, lm] = last.split("-").map(Number); while (y < ly || (y === ly && m <= lm)) { put(`${y}-${pad2(m)}`); if (++m > 12) { m = 1; y++; } } }
      else for (let t = new Date(first + "T00:00:00"); isoDay(t) <= last; t.setDate(t.getDate() + 1)) put(isoDay(t));
      const agg = Object.fromEntries(keys.map((k) => [k, { out: 0, in: 0 }]));
      calls.forEach((c) => { agg[byMonth ? c.dt.slice(0, 7) : c.dt.slice(0, 10)][c.direction === "out" ? "out" : "in"]++; });
      const max = Math.max(...keys.map((k) => agg[k].out + agg[k].in)), step = Math.ceil(keys.length / 16);
      const lab = (k) => (byMonth ? k.slice(5) + "." + k.slice(2, 4) : k.slice(8) + "." + k.slice(5, 7));
      const tot = (d) => calls.filter((c) => c.direction === d).length;
      return `<section class="panel"><div class="panel-h"><h2>Звонки ${byMonth ? "по месяцам" : "по дням"}</h2></div><div class="panel-b">
        <div class="cchart" role="img" aria-label="Звонки ${byMonth ? "по месяцам" : "по дням"}: исходящие и входящие">${keys.map((k) => { const a = agg[k], n = a.out + a.in;
          return `<div class="col" title="${esc(lab(k))}: исходящих ${a.out}, входящих ${a.in}">${a.in ? `<div class="seg-in" style="height:${a.in / max * 100}%"></div>` : ""}${a.out ? `<div class="seg-out" style="height:${a.out / max * 100}%"></div>` : ""}</div>`; }).join("")}</div>
        <div class="cchart-x">${keys.map((k, i) => `<span>${i % step === 0 ? esc(lab(k)) : ""}</span>`).join("")}</div>
        <div class="cchart-leg"><span><i class="seg-out"></i>Исходящие · ${nf(tot("out"))}</span><span><i class="seg-in"></i>Входящие · ${nf(tot("in"))}</span><span class="muted">Всего · ${nf(calls.length)} · максимум за ${byMonth ? "месяц" : "день"} · ${nf(max)}</span></div>
        ${claudeResults()}
      </div></section>`;
    };
    const th = (key, label) => `<th aria-sort="${sort.key === key ? (sort.dir > 0 ? "ascending" : "descending") : "none"}"><button type="button" class="sort-h${sort.key === key ? " on" : ""}" data-sort="${key}" title="Сортировать">${label}<span aria-hidden="true">${sort.key === key ? (sort.dir > 0 ? " ▲" : " ▼") : ""}</span></button></th>`;
    main.innerHTML = `
      <div class="head"><div><div class="eyebrow">Записи разговоров</div><h1>Звонки</h1>
        <div class="sub">${isMgr ? "Звонки сотрудников" : multi ? "Звонки вашего отдела" : "Ваши звонки"} с записью · ${esc(title)} · ${nf(d.calls.length)}</div></div>
        ${isMgr && d.calls.length ? `<div style="margin-left:auto;text-align:right"><div style="display:flex;gap:8px;justify-content:flex-end">${modelMenu()}<details class="proc" id="cProc"><summary class="btn">Обработать…</summary><div class="proc-pop">
          ${picked ? `<button type="button" data-batch="sel">Выбранные <span class="muted small">· ${nf(picked)}</span></button>` : ""}
          <button type="button" data-batch="all">Всё <span class="muted small">· ${nf(todoAll)} к обработке</span></button>
          <button type="button" data-batch="yday">За прошлый день</button>
          <button type="button" id="cRngTog" aria-expanded="false">Выбрать период… ▸</button>
          <div class="rng" id="cRng" hidden><label for="cRngFrom">с<input type="date" id="cRngFrom" value="${esc(isoDay(new Date()))}"></label><label for="cRngTo">по<input type="date" id="cRngTo" value="${esc(isoDay(new Date()))}"></label><button class="btn" type="button" data-batch="range">Обработать</button></div>
          <button type="button" id="cLastTog" aria-expanded="false">Последние… ▸</button>
          ${[20, 50, 100].map((n) => `<button type="button" class="sub" data-batch="last" data-n="${n}" hidden>${n} звонков</button>`).join("")}
        </div></details></div><div class="muted small" id="cJob" style="margin-top:4px"></div></div>` : ""}</div>
      <section class="panel"><div class="panel-h"><div class="filters">
          ${d.deal != null ? "" : periodHtml(state.cPer, "c")}
          ${multi ? `<label for="cLogin">Сотрудник <select id="cLogin"><option value="">Все</option>${emps.map((e) => `<option value="${esc(e.login)}" ${e.login === d.login ? "selected" : ""}>${esc(e.name)}</option>`).join("")}</select></label>` : ""}
          <form class="inline-form" id="cDealForm"><label for="cDeal">Сделка №</label><input id="cDeal" inputmode="numeric" placeholder="ID в Битрикс24" value="${esc(d.deal ?? "")}">
            <button class="btn" type="submit">Найти</button>${d.deal != null ? `<button class="btn ghost" type="button" id="cDealClear">× вернуться к периоду</button>` : ""}</form>
          <button class="btn" type="button" id="cReset" ${callsFiltered() ? "" : "disabled"}>Сбросить фильтры</button></div>
          ${isMgr && d.download && (d.download.running || d.download.message) ? `<span class="muted small">${esc(d.download.running ? "Скачивание записей идёт…" : d.download.message)}</span>` : ""}</div>
        ${d.calls.length ? `<div class="panel-b" style="padding-bottom:0">${pgHtml(cpg, calls.length, "звонков")}</div>` : ""}
        ${d.calls.length ? `<div class="scroll"><table class="staff-list calls"><thead><tr>${isMgr ? `<th><input type="checkbox" class="pick" id="cPickAll" aria-label="Выбрать все звонки списка с записью" ${picked && picked === ready.length ? "checked" : ""}></th>` : ""}${th("dt", "Дата")}${multi ? th("emp", "Сотрудник") : ""}${th("direction", "Звонок")}${th("duration", "Длит.")}<th>Клиент</th><th>Разбор</th><th>Телефон</th><th>Сделки</th>${isMgr ? "<th>Прослушано</th>" : ""}<th>Запись</th></tr></thead><tbody>
          ${calls.slice(pgc.from, pgc.to).map((c) => `<tr>${isMgr ? `<td>${c.audio === "ready" ? `<input type="checkbox" class="pick" data-pick="${esc(c.id)}" aria-label="Выбрать звонок" ${state.cSel.has(c.id) ? "checked" : ""}>` : ""}</td>` : ""}<td class="nw">${esc(dtLabel(c.dt))}</td>${multi ? `<td>${esc(c.emp_name)}</td>` : ""}<td class="nw">${DIR[c.direction] || "—"}</td>
            <td class="nw n">${dur(c.duration)}</td><td>${esc(c.client || "—")}</td><td class="an-cell">${anCell(c)}</td><td class="nw">${esc(c.phone || "—")}</td><td class="nw">${deals(c)}</td>
            ${isMgr ? `<td class="nw">${c.listens ? `${c.listens} раз` : "—"}</td>` : ""}<td class="nw" data-rec="${esc(c.id)}">${audio(c)}</td></tr>`).join("")}
        </tbody></table></div>` : `<div class="empty">Звонков с записью ${d.deal != null ? "по этой сделке" : "за этот период"} нет</div>`}
        <div class="panel-b muted small">${isMgr ? "Каждое прослушивание записывается в журнал: кто, какой звонок, когда и с какого адреса." : `Вы видите ${multi ? "звонки своего отдела" : "только свои звонки"}. Прослушивания записываются в журнал, его видит администратор.`}
          Записи появляются после синхронизации с Битрикс24${d.keep_from ? `. Сейчас хранятся записи с ${ruDay(d.keep_from)}: текущий и прошлый месяц, более старые удаляются 10-го числа` : ""}.</div></section>
      ${callsChart()}
      ${isMgr ? `<section class="panel"><details class="more" id="cLog" ${state.cLogOpen ? "open" : ""}><summary>Журнал прослушиваний${log ? ` · ${log.rows.length}` : ""}</summary><div class="more-b">
        <form class="inline-form" id="cLogForm"><label for="cLogFrom">С</label><input id="cLogFrom" type="date" value="${esc(log ? log.date_from : state.cLogFrom || "")}">
          <label for="cLogTo">по</label><input id="cLogTo" type="date" value="${esc(log ? log.date_to : state.cLogTo || "")}"><button class="btn" type="submit">Показать</button></form>
        ${log && log.rows.length ? `<div class="dt-wrap" style="max-height:480px"><table class="dt"><thead><tr><th>Когда</th><th>Кто</th><th>Чей звонок</th><th>Звонок</th><th>Клиент</th><th>IP</th><th>Результат</th></tr></thead><tbody>
          ${log.rows.map((r) => `<tr><td>${esc(dtLabel(r.ts))}</td><td>${esc(r.name)}</td><td>${esc(r.emp_name || "—")}</td>
            <td>${r.call_dt ? `${esc(dtLabel(r.call_dt))} · ${DIR[r.direction] || ""} · ${dur(r.duration)}` : esc(r.record)}</td><td>${esc(r.client || "—")}</td>
            <td>${esc(r.ip || "")}</td><td>${r.result === "ok" ? "прослушал(а)" : r.result === "read" ? "открыл(а) расшифровку" : `<span style="color:var(--bad)">отказано: нет прав</span>`}</td></tr>`).join("")}
        </tbody></table></div>` : log ? `<div class="muted small">За период прослушиваний нет.</div>` : ""}
      </div></details></section>` : ""}`;
    main.querySelectorAll("[data-sort]").forEach((b) => b.addEventListener("click", () => {
      const key = b.dataset.sort;  // первый щелчок: дата и длительность — по убыванию, текст — по алфавиту
      state.cSort = sort.key === key ? { key, dir: -sort.dir } : { key, dir: key === "dt" || key === "duration" ? -1 : 1 };
      cpg.page = 0;
      renderCalls(d, log);
    }));
    pgBind(main, cpg, () => renderCalls(d, log));
    // ручная обработка: один звонок, «Всё» или последние N из текущего списка (по периоду и фильтрам)
    const job = document.getElementById("cJob"), proc = document.getElementById("cProc");
    const startProc = async (body, ask) => {
      if (ask && !confirm(ask)) return;
      body = { ...body, model: pick("callModel", MODELS, "claude-sonnet-5-5"), effort: pick("callEffort", EFFORTS, "medium") };
      try {
        const r = await api(`/api/calls-process?${state.cQs}`, body);
        toast(r.message);
        if (r.ok) watchJob(); else if (job) job.textContent = r.message;
      } catch (e) { if (e.message !== "auth") toast(e.message); }
    };
    const watchJob = async () => {
      clearTimeout(state.cJobT);
      if (state.view !== "calls") return;
      let st;
      try { st = await api("/api/calls-job"); } catch (e) { return; }
      const el = document.getElementById("cJob"), pr = document.getElementById("cProc");
      if (pr) pr.dataset.busy = st.running ? "1" : "";
      if (st.running) {
        if (el) el.textContent = `${st.message} · готово ${st.done}${st.failed ? `, ошибок ${st.failed}` : ""} из ${st.total}`;
        state.cJobT = setTimeout(watchJob, 3000);
      } else if (state.cJobWas) {
        state.cJobWas = false; toast(st.message); loadCalls();
      } else if (el && st.finished && st.message) el.textContent = st.message;
      if (st.running) state.cJobWas = true;
    };
    if (isMgr) watchJob();
    main.querySelectorAll("[data-proc]").forEach((btn) => btn.addEventListener("click", () => startProc({ id: btn.dataset.proc })));
    main.querySelectorAll("[data-model],[data-effort]").forEach((b) => b.addEventListener("click", () => {
      save(b.dataset.model ? "callModel" : "callEffort", b.dataset.model || b.dataset.effort);
      renderCalls(d, log);
    }));
    main.querySelectorAll("[data-pick]").forEach((b) => b.addEventListener("change", () => {
      if (b.checked) state.cSel.add(b.dataset.pick); else state.cSel.delete(b.dataset.pick);
      renderCalls(d, log);
    }));
    const pickAll = document.getElementById("cPickAll");
    if (pickAll) {
      pickAll.indeterminate = picked > 0 && picked < ready.length;
      pickAll.addEventListener("change", () => { state.cSel = new Set(pickAll.checked ? ready.map((c) => c.id) : []); renderCalls(d, log); });
    }
    const rngTog = document.getElementById("cRngTog");
    if (rngTog) rngTog.addEventListener("click", () => {
      const open = rngTog.getAttribute("aria-expanded") !== "true";
      rngTog.setAttribute("aria-expanded", open); rngTog.textContent = open ? "Выбрать период… ▾" : "Выбрать период… ▸";
      document.getElementById("cRng").hidden = !open;
    });
    const tog = document.getElementById("cLastTog");
    if (tog) tog.addEventListener("click", () => {
      const open = tog.getAttribute("aria-expanded") !== "true";
      tog.setAttribute("aria-expanded", open); tog.textContent = open ? "Последние… ▾" : "Последние… ▸";
      main.querySelectorAll(".proc-pop .sub").forEach((b) => { b.hidden = !open; });
    });
    main.querySelectorAll("[data-batch]").forEach((btn) => btn.addEventListener("click", () => {
      const kind = btn.dataset.batch, risk = "Расшифровка идёт на этом компьютере, разбор — через Claude и расходует лимит подписки.";
      if (kind === "sel" || kind === "yday" || kind === "range") {
        let body, what;
        if (kind === "sel") { body = { ids: [...state.cSel] }; what = `выбранных звонков: ${picked} (уже разобранные будут разобраны заново)`; }
        else {
          let a, b;
          if (kind === "yday") { const t = new Date(); t.setDate(t.getDate() - 1); a = b = isoDay(t); }
          else { a = document.getElementById("cRngFrom").value; b = document.getElementById("cRngTo").value; if (!a || !b) { toast("Укажите период"); return; } if (a > b) [a, b] = [b, a]; }
          body = { mode: "range", date_from: a, date_to: b }; what = `звонков за ${periodLabel(a, b)} (необработанных)`;
        }
        if (proc) proc.open = false;
        startProc(body, `Обработать ${what}? ${risk}`).then(() => { if (kind === "sel") { state.cSel = new Set(); } });
        return;
      }
      if (proc) proc.open = false;
      const all = btn.dataset.batch === "all", n = +btn.dataset.n || 0;
      const count = all ? todoAll : [...d.calls].filter((c) => c.audio === "ready").sort((a, b) => cmp(b.dt, a.dt)).slice(0, n).filter(needs).length;
      if (!count) { toast("Выбранные звонки уже обработаны"); return; }
      startProc(all ? { mode: "all" } : { mode: "last", n },
        `Обработать звонков: ${count}? Расшифровка идёт на этом компьютере, разбор — через Claude и расходует лимит подписки.`);
    }));
    bindPeriod("c", () => state.cPer, (v) => { state.cPer = v; }, loadCalls);
    const sel = document.getElementById("cLogin");
    if (sel) sel.addEventListener("change", () => { state.cLogin = sel.value; loadCalls(); });
    document.getElementById("cDealForm").addEventListener("submit", (ev) => { ev.preventDefault(); state.cDeal = document.getElementById("cDeal").value; loadCalls(); });
    document.getElementById("cReset").addEventListener("click", () => {
      state.cPer = state.cLogin = state.cDeal = state.cSort = undefined;
      loadCalls();
    });
    const clr = document.getElementById("cDealClear");
    if (clr) clr.addEventListener("click", () => { state.cDeal = ""; loadCalls(); });
    // плеер создаётся только по нажатию: иначе браузер заранее скачал бы записи и они попали бы в журнал как прослушанные
    const player = (id, at) => {
      const cell = main.querySelector(`[data-rec="${CSS.escape(id)}"]`);
      let au = cell.querySelector("audio");
      if (!au) {
        au = document.createElement("audio");
        au.controls = true; au.preload = "auto"; au.setAttribute("controlsList", "nodownload");
        au.src = "/api/call-audio?id=" + encodeURIComponent(id);
        au.addEventListener("error", () => { cell.querySelector(".rec-cell").innerHTML = `<span style="color:var(--bad)">не удалось воспроизвести</span>`; });
        au.addEventListener("play", () => main.querySelectorAll("audio").forEach((a) => { if (a !== au) a.pause(); }));
        cell.querySelector("[data-play]").replaceWith(au);
      }
      if (at != null) { if (au.readyState >= 1) au.currentTime = at; else au.addEventListener("loadedmetadata", () => { au.currentTime = at; }, { once: true }); }
      au.play().catch(() => {});
    };
    main.querySelectorAll("[data-play]").forEach((btn) => btn.addEventListener("click", () => player(btn.dataset.play)));
    // расшифровка раскрывается строкой под звонком; щелчок по таймкоду — слушать с этого места
    main.querySelectorAll("[data-text]").forEach((btn) => btn.addEventListener("click", async () => {
      const tr = btn.closest("tr"), next = tr.nextElementSibling;
      if (next && next.classList.contains("tr-row")) { next.remove(); btn.setAttribute("aria-expanded", "false"); return; }
      const row = document.createElement("tr");
      row.className = "tr-row";
      row.innerHTML = `<td colspan="${tr.children.length}"><div class="muted small">Загрузка…</div></td>`;
      tr.after(row); btn.setAttribute("aria-expanded", "true");
      try {
        const t = await api("/api/call-transcript?id=" + encodeURIComponent(btn.dataset.text));
        const roles = t.sentences.some((s) => s[1]);  // роли есть — показываем по предложениям, иначе по фрагментам
        const lines = roles ? t.sentences.map((s) => [s[0], s[1], s[2]]) : t.segments.map((s) => [s[0], "", s[2]]);
        row.firstElementChild.innerHTML = `<div class="tr-wrap">${analysisHtml(t.analysis, btn.dataset.text)}
          <div class="transcript">${lines.length ? lines.map((s, i) => {
            const same = roles && i && lines[i - 1][1] === s[1];  // реплика того же говорящего — без повтора подписи
            return `<p class="${s[1] ? "r" + s[1] : ""}"><button type="button" class="linkish ts" data-at="${s[0]}" title="Слушать с этого места">${dur(Math.floor(s[0]))}</button> ${s[1] && !same ? `<b>${ROLE[s[1]] || ""}:</b> ` : ""}${esc(s[2])}</p>`;
          }).join("") : `<p class="muted">Речь не распознана</p>`}</div></div>
          <div class="muted small">Расшифровка автоматическая (GigaAM v3): возможны ошибки в отдельных словах. ${roles ? "Кто говорит — определил Claude по смыслу." : "Реплики не размечены: разбора ещё нет."} Разбор — Claude по обезличенному тексту.</div>`;
        row.querySelectorAll("[data-at]").forEach((b) => b.addEventListener("click", () => player(btn.dataset.text, +b.dataset.at)));
        row.querySelectorAll("[data-secr]").forEach((sel) => sel.addEventListener("change", async () => {
          try {
            await api("/api/call-secretary", { id: sel.dataset.secr, value: sel.value === "" ? null : +sel.value });
            toast("Отметка сохранена — KPI с октября 2026 учитывает её"); sideCache = {}; loadCalls();
          } catch (e) { if (e.message !== "auth") toast(e.message); }
        }));
      } catch (e) { if (e.message !== "auth") row.firstElementChild.innerHTML = `<div style="color:var(--bad)">${esc(e.message)}</div>`; }
    }));
    const lg = document.getElementById("cLog");
    if (lg) lg.addEventListener("toggle", () => { if (lg.open !== !!state.cLogOpen) { state.cLogOpen = lg.open; if (lg.open && !log) loadCalls(); } });
    const lf = document.getElementById("cLogForm");
    if (lf) lf.addEventListener("submit", (ev) => { ev.preventDefault(); state.cLogFrom = document.getElementById("cLogFrom").value; state.cLogTo = document.getElementById("cLogTo").value; loadCalls(); });
  }

  // ---------- метрики отделов: где сейчас находится работа (макет Dashboard_TTK.xlsx)
  async function loadMetrics() {
    const main = document.getElementById("main"), m = METRICS[state.view];
    try {
      if (m.kind === "sales") { await loadSales(); return; }
      if (m.kind === "logistics") {
        if (!state.lPer) state.lPer = { mode: "month", month: state.boot.current_month };
        const [a, b] = periodRange(state.lPer);
        renderLogistics(await api(`/api/metrics?kind=logistics&date_from=${a || "2000-01-01"}&date_to=${b}`));
        return;
      }
      if (!state.mPer) state.mPer = { mode: "month", month: state.boot.current_month };
      const [a, b] = periodRange(state.mPer);
      renderSupply(await api(`/api/metrics?kind=supply&date_from=${a || "2000-01-01"}&date_to=${b}`));
    } catch (e) { if (e.message !== "auth") main.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }
  const ruMoment = (v) => (v ? ruDay(v.slice(0, 10)) + (v.length > 10 ? " " + v.slice(11, 16) : "") : "—");
  // даты поручения экспедитору: ДОП/ДОФ/просрочка отгрузки и ДПП/ДФП/просрочка поставки (план − факт, «−1» — позже плана)
  const foDates = (r) => {
    const day = (v) => (v ? ruDay(v.slice(0, 10)) : "—");
    const delta = (n) => (n == null ? "—" : `<b class="${n < 0 ? "fo-bad" : n > 0 ? "fo-ok" : ""}">${n > 0 ? "+" + nf(n) : n < 0 ? "−" + nf(-n) : "0"}</b>`);
    const cell = (cap, tip, val) => `<div title="${tip}"><span class="fo-cap">${cap}</span>${val}</div>`;
    return `<div class="fo-grid">${cell("ДОП", "Дата отгрузки, план", day(r.dop))}${cell("ДОФ", "Дата отгрузки, факт", day(r.dof))}${cell("Просрочка отгрузки, дн.", "ДОП − ДОФ", delta(r.ship_delta))}`
      + `${cell("ДПП", "Дата плановой поставки", day(r.dpp))}${cell("ДФП", "Дата фактической поставки", day(r.dfp))}${cell("Просрочка поставки, дн.", "ДПП − ДФП", delta(r.delivery_delta))}</div>`;
  };
  const lateCell = (n) => (n == null ? `<td class="n muted">нет даты</td>` : `<td class="n${n > 0 ? " late" : ""}">${n > 0 ? nf(n) : "—"}</td>`);
  function renderSupply(d) {

    const tot = (key) => d.people.reduce((x, p) => x + p.stages[key], 0);
    main.innerHTML = `
      <div class="head"><div><div class="eyebrow">Метрики · данные 1С</div><h1>Снабжение</h1>

        <div class="panel stat"><div class="eyebrow">Завершено за период</div><div class="v">${nf(t.done_calc)} <small>/ ${nf(t.done_orders)}</small></div><div class="h">отработано заявок (по дате закрытия) / поставлено заказов (по последнему поступлению)</div></div>

          <tr class="tot"><th>Итого</th>${ST.map((s) => `<td class="n">${nf(tot(s.key))}</td>`).join("")}<td class="n">${nf(t.overdue)}</td><td class="n">${nf(t.in_work)}</td></tr>

        <div class="panel-b">${d.orders.length ? `<div class="dt-wrap" style="max-height:420px"><table class="dt"><thead><tr><th>Заказ</th><th>Поставщик</th><th>Сотрудник</th><th class="n">Закупка без НДС, ₽</th><th>Размещён</th><th>План поставки</th><th>Факт поставки</th><th class="n">Просрочка, дн.</th></tr></thead><tbody>
          ${d.orders.map((o) => `<tr><td>${esc(o.doc)}</td><td>${esc(o.supplier || "—")}</td><td>${esc(o.emp)}</td><td class="n">${nf(o.amount)}</td><td>${ruMoment(o.dt)}</td><td>${ruMoment(o.plan)}</td><td>${ruMoment(o.fact)}</td>${lateCell(o.late_days)}</tr>`).join("")}

  // ---------- «Поставщики»: закупки, номенклатура и цены из 1С (макет «ТТК_Поставщики_дашборд_ТЗ.xlsx»); вход из карточки Битрикса: #suppliers?inn=…
  let supTimer = null;
  const supQuery = (h) => { const i = h.indexOf("?"); return Object.fromEntries(new URLSearchParams(i < 0 ? "" : h.slice(i + 1))); };
  function supFromHash(h) {  // ссылка из карточки поставщика: #suppliers?inn=… или ?partner=…
    const q = supQuery(h);
    state.sup = { partner: q.partner || "", inn: q.inn || "", item: "", date_from: q.date_from || "", date_to: q.date_to || "", hq: h, mode: q.mode === "requests" ? "requests" : "" };
  }
  function supParams(refresh) {
    const s = (state.sup = state.sup || {}), p = new URLSearchParams();
    for (const k of ["partner", "inn", "item", "date_from", "date_to"]) if (s[k]) p.set(k, s[k]);
    if (s.mode === "requests") { p.set("mode", "requests"); if (s.notBought) p.set("not_bought", "1"); }
    if (s.search && !s.partner && !s.inn) p.set("search", s.search);  // поиск по списку; в карточке поставщика фильтруются её таблицы
    if (refresh) p.set("refresh", "1");
    return p;
  }
  async function loadSuppliers(refresh) {
    clearTimeout(supTimer);
    const p = supParams(refresh);
    try {
      const d = await api("/api/suppliers?" + p);
      renderSuppliers(d);
      if (d.refreshing) supTimer = setTimeout(() => { if (state.view === "suppliers") loadSuppliers(); }, 4000);  // идёт загрузка из 1С
    } catch (e) { if (e.message !== "auth") document.getElementById("main").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }
  function renderSuppliers(d) {
    const s = state.sup, M = d.meta || {}, T = d.tiles, pr = (v) => (v == null ? "—" : nf(v, 2) + " ₽");
    const pc = (v) => {  // изменение цены: чёрные цифры на бледном красном (рост) или зелёном (снижение) квадрате; ноль — без заливки
