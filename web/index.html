    const opts = (v) => ["", 100, 75, 50, 25, 0].map((o) => `<option value="${o}" ${String(v ?? "") === String(o) ? "selected" : ""}>${o === "" ? "—" : o}</option>`).join("");
    return `<div class="manual"><div class="eyebrow">Еженедельная оценка руководителя</div>
      <div class="scroll"><table><thead><tr><th>Неделя с</th>${crit.map((c) => `<th>${esc(titles[c])}</th>`).join("")}<th>Комментарий</th></tr></thead><tbody>
      ${d.weeks.map((w, wi) => `<tr><td class="num">${dLabel(w)}</td>${crit.map((c) => {
        const s = it.manual.weeks[c][wi];
        return `<td>${isMgr ? `<select aria-label="${esc(titles[c])}, неделя с ${dLabel(w)}" data-score data-week="${w}" data-crit="${c}">${opts(s.score)}</select>` : `<span class="num">${s.score ?? "—"}</span>`}</td>`;
      }).join("")}<td>${(() => { const cm = crit.map((c) => it.manual.weeks[c][wi].comment).filter(Boolean).join("; ");
        return isMgr ? `<input type="text" aria-label="Комментарий, неделя с ${dLabel(w)}" data-comment data-week="${w}" value="${esc(cm)}" placeholder="замечания">` : `<span class="small">${esc(cm) || "—"}</span>`; })()}</td></tr>`).join("")}
      </tbody></table></div>${isMgr ? `<div class="small muted">100 — без замечаний. Пункт выполнен, если средняя оценка за месяц 100.</div>` : ""}</div>`;
  }

  // ручной ввод к записям из 1С: срок и дата оплаты реализаций, брак, отсрочка, признаки конкурентной закупки
  function entryBlock(d, it) {
    const en = it.entry, isMgr = state.boot.me.role === "manager";
    if (!en.rows.length) return `<div class="manual"><div class="eyebrow">Данные для ввода</div><div class="small muted">За ${MONTHS[+d.month.slice(5) - 1].toLowerCase()} записей из 1С нет.</div></div>`;
    const show = (f, v) => v == null ? "—" : f.type === "bool" ? (v ? "да" : "нет") : f.type === "pct" ? nf(v * 100, 0) + "%" : f.type === "date" ? v : nf(v);
    const input = (r, f) => {
      const v = r.values[f.key], lbl = `${esc(f.title)}, ${esc(r.cells[0])}`;
      const data = `data-entry data-table="${en.table}" data-ref="${esc(r.ref)}" data-field="${f.key}" aria-label="${lbl}"`;
      if (f.type === "bool") return `<select ${data}><option value="" ${v == null ? "selected" : ""}>—</option><option value="1" ${v === 1 ? "selected" : ""}>да</option><option value="0" ${v === 0 ? "selected" : ""}>нет</option></select>`;
      if (f.type === "date") return `<input type="date" ${data} value="${esc(v || "")}">`;
      if (f.type === "text") return `<input type="text" ${data} value="${esc(v ?? "")}" style="min-width:90px">`;
      const shown = v == null ? "" : f.type === "pct" ? Math.round(v * 1000) / 10 : v;
      return `<input type="number" min="0" ${f.type === "pct" ? 'max="100" step="1"' : 'step="1"'} ${data} value="${shown}" style="width:80px">`;
    };
    return `<div class="manual"><div class="eyebrow">${isMgr ? "Ввод руководителя к данным 1С" : "Данные, введённые руководителем"}</div>
      <div class="scroll"><table><thead><tr>${en.columns.map((c) => `<th>${esc(c)}</th>`).join("")}${en.fields.map((f) => `<th>${esc(f.title)}</th>`).join("")}</tr></thead><tbody>
      ${en.rows.map((r) => `<tr>${r.cells.map((c, ci) => `<td class="${typeof c === "number" ? "num nw" : ci < 2 ? "nw" : ""}">${typeof c === "number" ? nf(Math.round(c)) : esc(c ?? "—")}</td>`).join("")}${en.fields.map((f) =>
        `<td${r.manual.includes(f.key) ? ' class="manual-set" title="Введено вручную"' : ""}>${isMgr ? input(r, f) : show(f, r.values[f.key])}</td>`).join("")}</tr>`).join("")}
      </tbody></table></div>${isMgr ? `<div class="small muted">Сохраняется сразу. Подчёркнутые значения введены вручную и не стираются при обновлении из 1С; пустое поле — значение из 1С или нет данных.</div>` : ""}</div>`;
  }

  // штрафы за нарушение финансовой дисциплины: вносит руководитель; «штрафов нет» — явная отметка за месяц
  function penaltyBlock(d, it) {
    const pb = it.penalties, isMgr = state.boot.me.role === "manager";
    const mon = MONTHS[+d.month.slice(5) - 1].toLowerCase();
    const list = pb.rows.length ? `<div class="scroll"><table><thead><tr><th>Дата</th><th>Сумма, ₽</th><th>Основание</th>${isMgr ? "<th></th>" : ""}</tr></thead><tbody>
      ${pb.rows.map((r) => `<tr><td class="nw">${esc(r.dt)}</td><td class="num nw">${nf(r.amount)}</td><td>${esc(r.reason || "—")}</td>${isMgr ? `<td><button class="btn" type="button" data-pen-del="${r.id}">Удалить</button></td>` : ""}</tr>`).join("")}
      </tbody></table></div>` : `<div class="small">${pb.checked ? `За ${mon} штрафов нет (отмечено руководителем).` : `За ${mon} штрафы не внесены.`}</div>`;
    if (!isMgr) return `<div class="manual"><div class="eyebrow">Штрафы за нарушение финансовой дисциплины</div>${list}</div>`;
    const day = d.month === state.boot.current_month ? new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10) : d.month + "-01";
    return `<div class="manual"><div class="eyebrow">Штрафы за нарушение финансовой дисциплины</div>${list}
      <form class="inline-form" data-pen-add><label for="pen-dt">Дата</label><input id="pen-dt" type="date" value="${day}" min="${d.month}-01" max="${d.month}-31" required>
        <label for="pen-sum">Сумма, ₽</label><input id="pen-sum" type="number" min="0" step="1" style="width:110px">
        <label for="pen-why">Основание</label><input id="pen-why" type="text" maxlength="300" placeholder="за что">
        <button class="btn" type="submit">Добавить штраф</button></form>
      ${pb.rows.length ? "" : `<label class="small"><input type="checkbox" data-pen-check ${pb.checked ? "checked" : ""}> За ${mon} штрафов нет</label>`}
      <div class="small muted">Пока за месяц не внесён штраф или не отмечено «штрафов нет», пункт ждёт ввода.</div></div>`;
  }

  function renderEmp(d) {
    const main = document.getElementById("main");
    const b = state.boot, isMgr = b.me.role === "manager", inProg = d.in_progress;
    const zeroed = d.zero_all.length > 0;
    main.innerHTML = `
      <div class="head"><div><div class="eyebrow">${esc(d.department)} · ${esc(d.position_title)}</div><h1>${esc(d.name)}</h1>
        <div class="sub">${mLabel(d.month)} · ${inProg ? `идёт ${d.working_days_elapsed}-й рабочий день из ${d.working_days}` : `${d.working_days} рабочих дней`}</div></div>
        ${isMgr ? `<button class="btn" type="button" id="backBtn">← Вся команда</button>` : ""}</div>
      <section class="panel hero">
        <div><div class="eyebrow">${inProg ? "Начислено на сегодня" : "KPI к выплате"}</div>
          <div class="big" style="margin-top:8px;${zeroed ? "color:var(--bad)" : ""}">${nf(d.payout)} <small>₽ из ${nf(d.kpi_bonus)}</small></div>
          <div class="weights" role="img" aria-label="Структура KPI по пунктам">${d.items.map((i) => `<div class="seg ${zeroed && i.payout ? "zeroed" : i.payout ? "met" : ""}" style="flex:${i.weight}" title="KPI ${i.n}. ${esc(i.title)} — ${rub(i.payout)} из ${rub(i.amount)}">${i.n}</div>`).join("")}</div>
          <div class="legend"><span><i style="background:var(--good)"></i>начислено</span><span><i style="border:1.5px solid var(--line-strong)"></i>не начислено</span>${zeroed ? `<span><i style="background:repeating-linear-gradient(135deg,var(--bad-soft) 0 3px,var(--surface) 3px 6px);border:1.5px solid var(--bad)"></i>обнулено</span>` : ""}<span>ширина — вес пункта</span></div>
          ${zeroed ? d.zero_all.map((z) => `<div class="zero-note" style="margin-top:10px">${esc(z)}</div>`).join("") : ""}
          ${d.absence && d.absence.days ? `<div class="muted small" style="margin-top:10px">${d.absent ? "Весь месяц не работал(а), KPI не считается" : `Не работал(а) ${d.absence.days} из ${d.working_days} рабочих дней`}: ${esc(d.absence.periods.join(", "))}</div>` : ""}
          ${d.absence && d.absence.truancy_days ? `<div class="small" style="margin-top:6px;color:var(--bad)">Прогулы: ${d.absence.truancy_days} раб. дн. — от норм не освобождают (${esc(d.absence.truancy.join(", "))})</div>` : ""}
          <div class="kv"><div><span class="eyebrow">Оклад</span><b>${rub(d.salary)}</b></div><div><span class="eyebrow">Пунктов выполнено</span><b>${d.met_count} из ${d.item_count}</b></div><div><span class="eyebrow">Итого с окладом</span><b>${rub(d.salary + d.payout)}</b></div></div>
        </div>
        <div><div class="eyebrow">Выплата KPI за 6 месяцев, ₽</div><div class="chart" id="payChart">${payoutChart(d.trend, d.kpi_bonus, b.current_month)}</div></div>
      </section>
      <section class="cards">${d.items.map((i) => {
        const st = STATUS[i.status] || STATUS.nodata;
        const ex = i.extra || [];
        return `<article class="panel card">
          <div class="card-h"><div class="meta">KPI ${i.n} · вес ${Math.round(i.weight * 100)}% · ${nf(i.amount)} ₽ · ${esc(i.period)}</div>
            <div class="card-score"><div class="p">${i.pct == null ? "—" : pct(i.pct)}</div><div class="r">${rub(i.payout)}</div></div>
            <h3>${esc(i.title)}</h3><div class="tgt"><span class="chip ${st[1]}">${st[0]}</span> &nbsp;${esc(i.target_text)}</div></div>
          <div class="card-b">${i.components.map((c) => compRow(c, inProg)).join("")}
            ${i.plan && isMgr ? `<form class="inline-form" data-plan="${i.plan.metric}"><label for="plan-${i.n}">План на ${MONTHS[+d.month.slice(5) - 1].toLowerCase()}, ₽</label><input id="plan-${i.n}" type="number" min="0" step="10000" value="${i.plan.value ?? ""}"><button class="btn" type="submit">Сохранить план</button>${i.plan.is_default ? `<span class="muted">сейчас — план по умолчанию</span>` : ""}</form>` : ""}
            ${i.code === "conversion_sales" && isMgr ? `<form class="inline-form" data-baseline><label for="base-${i.n}">Средняя конверсия прошлого года, %</label><input id="base-${i.n}" type="number" min="0" max="100" step="0.1"><button class="btn" type="submit">Сохранить</button></form>` : ""}
            ${i.manual ? manualBlock(d, i) : ""}
            ${i.entry ? entryBlock(d, i) : ""}
            ${i.penalties ? penaltyBlock(d, i) : ""}
            ${ex.length ? `<div class="extra">${ex.map((x) => `<div>${esc(x.label)}: <b>${fmtExtra(x)}</b>${x.hint ? ` <span class="muted">(${esc(x.hint)})</span>` : ""}</div>`).join("")}</div>` : ""}
          </div>
          <details class="more"><summary>Как считается и из чего${i.details && i.details.rows.length ? ` · ${i.details.rows.length} записей` : ""}</summary><div class="more-b">
            <div class="desc">${esc(i.description)}</div>
            ${i.funnel ? `<div><div class="eyebrow" style="margin-bottom:6px">${esc(i.funnel.title)}</div><div class="funnel">${(() => { const mx = Math.max(1, ...i.funnel.steps.map((s) => s[1])); return i.funnel.steps.map((s) => `<div class="row"><span>${esc(s[0])}</span><div class="fb" style="width:${Math.max(1, (s[1] / mx) * 100)}%"></div><b>${nf(s[1])}</b></div>`).join(""); })()}</div></div>` : ""}
            ${i.details && i.details.rows.length ? `<div class="dt-wrap"><table class="dt"><thead><tr>${i.details.columns.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>
              ${i.details.rows.map((r) => `<tr>${r.map((v, ci) => `<td class="${typeof v === "number" ? "n" : ""}">${fmtCell(v, i.details.columns[ci], (i.details.pct_cols || []).includes(ci))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : `<div class="muted small">Записей за период нет.</div>`}
          </div></details></article>`;
      }).join("")}</section>`;
    bindChart(document.getElementById("payChart"), d.trend, b.current_month);
    const back = document.getElementById("backBtn");
    if (back) back.addEventListener("click", () => { state.view = "team"; location.hash = "team"; load(); });
    main.querySelectorAll("select[data-score]").forEach((s) => s.addEventListener("change", async () => {
      const row = s.closest("tr"), cm = row.querySelector("[data-comment]");
      try {
        await api("/api/score", { emp: d.login, week: s.dataset.week, criterion: s.dataset.crit, score: s.value === "" ? null : +s.value, comment: cm ? cm.value : "" });
        if (!PREVIEW) { toast("Оценка сохранена, KPI пересчитан"); sideCache = {}; load(); }
      } catch (e) { toast(e.message); }
    }));
    main.querySelectorAll("input[data-comment]").forEach((inp) => inp.addEventListener("change", async () => {
      const row = inp.closest("tr");
      const sels = row.querySelectorAll("select[data-score]");
      try {
        for (const s of sels) if (s.value !== "") await api("/api/score", { emp: d.login, week: s.dataset.week, criterion: s.dataset.crit, score: +s.value, comment: inp.value });
        if (!PREVIEW) toast("Комментарий сохранён");
      } catch (e) { toast(e.message); }
    }));
    const penalty = async (body, msg) => {
      try { await api("/api/penalty", { emp: d.login, month: d.month, ...body }); if (!PREVIEW) { toast(msg); sideCache = {}; load(); } }
      catch (e) { toast(e.message); }
    };
    main.querySelectorAll("form[data-pen-add]").forEach((f) => f.addEventListener("submit", (ev) => {
      ev.preventDefault();
      penalty({ action: "add", dt: f.querySelector("#pen-dt").value, amount: f.querySelector("#pen-sum").value,
                reason: f.querySelector("#pen-why").value }, "Штраф добавлен, KPI пересчитан");
    }));
    main.querySelectorAll("[data-pen-del]").forEach((b) => b.addEventListener("click", () => {
      if (confirm("Удалить штраф?")) penalty({ action: "delete", id: b.dataset.penDel }, "Штраф удалён, KPI пересчитан");
    }));
    main.querySelectorAll("[data-pen-check]").forEach((c) => c.addEventListener("change", () =>
      penalty({ action: "check", checked: c.checked }, c.checked ? "Отмечено: штрафов нет" : "Отметка снята")));
    main.querySelectorAll("[data-entry]").forEach((el) => el.addEventListener("change", async () => {
      try {
        await api("/api/manual", { table: el.dataset.table, ref: el.dataset.ref, field: el.dataset.field, value: el.value });
        if (!PREVIEW) { toast("Сохранено, KPI пересчитан"); sideCache = {}; load(); }
      } catch (e) { toast(e.message); }
    }));
    main.querySelectorAll("form[data-plan]").forEach((f) => f.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      try { await api("/api/plan", { emp: d.login, month: d.month, metric: f.dataset.plan, value: +f.querySelector("input").value }); if (!PREVIEW) { toast("План сохранён"); sideCache = {}; load(); } }
      catch (e) { toast(e.message); }
    }));
    main.querySelectorAll("form[data-baseline]").forEach((f) => f.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      try { await api("/api/baseline", { emp: d.login, metric: "conversion_last_year", value: +f.querySelector("input").value / 100 }); if (!PREVIEW) { toast("Базовый уровень сохранён"); sideCache = {}; load(); } }
      catch (e) { toast(e.message); }
    }));
  }

  // ---------- звонки: записи разговоров и журнал прослушиваний
  const DIR = { out: "Исходящий", in: "Входящий" };
  const dur = (s) => `${Math.floor((s || 0) / 60)}:${String((s || 0) % 60).padStart(2, "0")}`;
  const dtLabel = (v) => (v || "").slice(0, 16).replace("T", " ").replace(/^(\d{4})-(\d{2})-(\d{2})/, "$3.$2.$1");
  async function loadCalls() {
    const main = document.getElementById("main"), isMgr = state.boot.me.role === "manager";
    try {
      const login = state.cLogin ?? "";
      const deal = (state.cDeal || "").trim();
      if (!state.cPer) state.cPer = { mode: "month", month: state.month };
      const [a, b] = periodRange(state.cPer);
      const per = a || b ? `&date_from=${a}&date_to=${b}` : "&all=1";
      const d = await api(`/api/calls?login=${encodeURIComponent(login)}${per}${deal ? "&deal=" + encodeURIComponent(deal) : ""}`);
      const log = isMgr && state.cLogOpen ? await api(`/api/listen-log?date_from=${state.cLogFrom || ""}&date_to=${state.cLogTo || ""}`) : null;
      renderCalls(d, log);
    } catch (e) { if (e.message !== "auth") main.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }
  function renderCalls(d, log) {
    const main = document.getElementById("main"), b = state.boot, isMgr = b.me.role === "manager";
    const audio = (c) => {
      if (c.audio === "ready") return c.can_listen ? `<span class="rec-cell"><button class="btn" type="button" data-play="${esc(c.id)}">▶ Слушать</button>${c.transcript === "ready"
        ? ` <button class="btn ghost" type="button" data-text="${esc(c.id)}" aria-expanded="false">Текст</button>` : c.transcript === "pending" ? ` <span class="muted small">текст готовится…</span>` : ""}</span>` : `<span class="muted">прослушивание недоступно</span>`;
      if (c.audio === "purged") return `<span class="muted">удалена${d.keep_days ? ` (хранится ${d.keep_days} дн.)` : ""}</span>`;
      if (c.audio === "error") return `<span style="color:var(--bad)">не удалось скачать</span>`;
      return `<span class="muted">скачивается…</span>`;
    };
    const deals = (c) => !c.deals.length ? "—" : c.deals.slice(0, 3).map((id) => d.portal
      ? `<a href="${esc(d.portal)}/crm/deal/details/${id}/" target="_blank" rel="noopener">${id}</a>` : String(id)).join(", ") +
      (c.deals.length > 3 ? ` <span class="muted" title="${c.deals.slice(3).join(", ")}">+${c.deals.length - 3}</span>` : "");
    const emps = d.employees, multi = emps.length > 1;  // администратор или руководитель отдела
    const title = d.deal != null ? `по сделке ${d.deal}` : periodLabel(d.date_from, d.date_to);
    // сортировка щелчком по заголовку; при равенстве — новые звонки выше
    const sort = state.cSort || { key: "dt", dir: -1 };
    const SORT_KEYS = { dt: (c) => c.dt, emp: (c) => c.emp_name || "", direction: (c) => DIR[c.direction] || "", duration: (c) => c.duration || 0 };
    const cmp = (a, b) => (typeof a === "number" ? a - b : String(a).localeCompare(String(b), "ru"));
    const calls = [...d.calls].sort((a, b) => sort.dir * cmp(SORT_KEYS[sort.key](a), SORT_KEYS[sort.key](b)) || cmp(b.dt, a.dt));
    const th = (key, label) => `<th aria-sort="${sort.key === key ? (sort.dir > 0 ? "ascending" : "descending") : "none"}"><button type="button" class="sort-h${sort.key === key ? " on" : ""}" data-sort="${key}" title="Сортировать">${label}<span aria-hidden="true">${sort.key === key ? (sort.dir > 0 ? " ▲" : " ▼") : ""}</span></button></th>`;
    main.innerHTML = `
      <div class="head"><div><div class="eyebrow">Записи разговоров</div><h1>Звонки</h1>
        <div class="sub">${isMgr ? "Звонки сотрудников" : multi ? "Звонки вашего отдела" : "Ваши звонки"} с записью · ${esc(title)} · ${nf(d.calls.length)}</div></div></div>
      <section class="panel"><div class="panel-h"><div class="filters">
          ${d.deal != null ? "" : periodHtml(state.cPer, "c")}
          ${multi ? `<label for="cLogin">Сотрудник <select id="cLogin"><option value="">Все</option>${emps.map((e) => `<option value="${esc(e.login)}" ${e.login === d.login ? "selected" : ""}>${esc(e.name)}</option>`).join("")}</select></label>` : ""}
          <form class="inline-form" id="cDealForm"><label for="cDeal">Сделка №</label><input id="cDeal" inputmode="numeric" placeholder="ID в Битрикс24" value="${esc(d.deal ?? "")}">
            <button class="btn" type="submit">Найти</button>${d.deal != null ? `<button class="btn ghost" type="button" id="cDealClear">× вернуться к периоду</button>` : ""}</form></div>
          ${isMgr && d.download && (d.download.running || d.download.message) ? `<span class="muted small">${esc(d.download.running ? "Скачивание записей идёт…" : d.download.message)}</span>` : ""}</div>
        ${d.calls.length ? `<div class="scroll"><table class="staff-list calls"><thead><tr>${th("dt", "Дата")}${multi ? th("emp", "Сотрудник") : ""}${th("direction", "Звонок")}${th("duration", "Длит.")}<th>Клиент</th><th>Телефон</th><th>Сделки</th>${isMgr ? "<th>Прослушано</th>" : ""}<th>Запись</th></tr></thead><tbody>
          ${calls.map((c) => `<tr><td class="nw">${esc(dtLabel(c.dt))}</td>${multi ? `<td>${esc(c.emp_name)}</td>` : ""}<td class="nw">${DIR[c.direction] || "—"}</td>
            <td class="nw n">${dur(c.duration)}</td><td>${esc(c.client || "—")}</td><td class="nw">${esc(c.phone || "—")}</td><td class="nw">${deals(c)}</td>
            ${isMgr ? `<td class="nw">${c.listens ? `${c.listens} раз` : "—"}</td>` : ""}<td class="nw" data-rec="${esc(c.id)}">${audio(c)}</td></tr>`).join("")}
        </tbody></table></div>` : `<div class="empty">Звонков с записью ${d.deal != null ? "по этой сделке" : "за этот период"} нет</div>`}
        <div class="panel-b muted small">${isMgr ? "Каждое прослушивание записывается в журнал: кто, какой звонок, когда и с какого адреса." : `Вы видите ${multi ? "звонки своего отдела" : "только свои звонки"}. Прослушивания записываются в журнал, его видит администратор.`}
          Записи появляются после синхронизации с Битрикс24${d.keep_days ? ` и хранятся ${d.keep_days} дней` : ""}.</div></section>
      ${isMgr ? `<section class="panel"><details class="more" id="cLog" ${state.cLogOpen ? "open" : ""}><summary>Журнал прослушиваний${log ? ` · ${log.rows.length}` : ""}</summary><div class="more-b">
        <form class="inline-form" id="cLogForm"><label for="cLogFrom">С</label><input id="cLogFrom" type="date" value="${esc(log ? log.date_from : state.cLogFrom || "")}">
          <label for="cLogTo">по</label><input id="cLogTo" type="date" value="${esc(log ? log.date_to : state.cLogTo || "")}"><button class="btn" type="submit">Показать</button></form>
        ${log && log.rows.length ? `<div class="dt-wrap" style="max-height:480px"><table class="dt"><thead><tr><th>Когда</th><th>Кто</th><th>Чей звонок</th><th>Звонок</th><th>Клиент</th><th>IP</th><th>Результат</th></tr></thead><tbody>
          ${log.rows.map((r) => `<tr><td>${esc(dtLabel(r.ts))}</td><td>${esc(r.name)}</td><td>${esc(r.emp_name || "—")}</td>
            <td>${r.call_dt ? `${esc(dtLabel(r.call_dt))} · ${DIR[r.direction] || ""} · ${dur(r.duration)}` : esc(r.record)}</td><td>${esc(r.client || "—")}</td>
            <td>${esc(r.ip || "")}</td><td>${r.result === "ok" ? "прослушал(а)" : r.result === "read" ? "открыл(а) расшифровку" : `<span style="color:var(--bad)">отказано: нет прав</span>`}</td></tr>`).join("")}
        </tbody></table></div>` : log ? `<div class="muted small">За период прослушиваний нет.</div>` : ""}
      </div></details></section>` : ""}`;
    main.querySelectorAll("[data-sort]").forEach((b) => b.addEventListener("click", () => {
      const key = b.dataset.sort;  // первый щелчок: дата и длительность — по убыванию, текст — по алфавиту
      state.cSort = sort.key === key ? { key, dir: -sort.dir } : { key, dir: key === "dt" || key === "duration" ? -1 : 1 };
      renderCalls(d, log);
    }));
    bindPeriod("c", () => state.cPer, (v) => { state.cPer = v; }, loadCalls);
    const sel = document.getElementById("cLogin");
    if (sel) sel.addEventListener("change", () => { state.cLogin = sel.value; loadCalls(); });
    document.getElementById("cDealForm").addEventListener("submit", (ev) => { ev.preventDefault(); state.cDeal = document.getElementById("cDeal").value; loadCalls(); });
    const clr = document.getElementById("cDealClear");
    if (clr) clr.addEventListener("click", () => { state.cDeal = ""; loadCalls(); });
    // плеер создаётся только по нажатию: иначе браузер заранее скачал бы записи и они попали бы в журнал как прослушанные
    const player = (id, at) => {
      const cell = main.querySelector(`[data-rec="${CSS.escape(id)}"]`);
      let au = cell.querySelector("audio");
      if (!au) {
        au = document.createElement("audio");
        au.controls = true; au.preload = "auto"; au.setAttribute("controlsList", "nodownload");
        au.src = "/api/call-audio?id=" + encodeURIComponent(id);
        au.addEventListener("error", () => { cell.querySelector(".rec-cell").innerHTML = `<span style="color:var(--bad)">не удалось воспроизвести</span>`; });
        au.addEventListener("play", () => main.querySelectorAll("audio").forEach((a) => { if (a !== au) a.pause(); }));
        cell.querySelector("[data-play]").replaceWith(au);
      }
      if (at != null) { if (au.readyState >= 1) au.currentTime = at; else au.addEventListener("loadedmetadata", () => { au.currentTime = at; }, { once: true }); }
      au.play().catch(() => {});
    };
    main.querySelectorAll("[data-play]").forEach((btn) => btn.addEventListener("click", () => player(btn.dataset.play)));
    // расшифровка раскрывается строкой под звонком; щелчок по таймкоду — слушать с этого места
    main.querySelectorAll("[data-text]").forEach((btn) => btn.addEventListener("click", async () => {
      const tr = btn.closest("tr"), next = tr.nextElementSibling;
      if (next && next.classList.contains("tr-row")) { next.remove(); btn.setAttribute("aria-expanded", "false"); return; }
      const row = document.createElement("tr");
      row.className = "tr-row";
      row.innerHTML = `<td colspan="${tr.children.length}"><div class="muted small">Загрузка…</div></td>`;
      tr.after(row); btn.setAttribute("aria-expanded", "true");
      try {
        const t = await api("/api/call-transcript?id=" + encodeURIComponent(btn.dataset.text));
        row.firstElementChild.innerHTML = `<div class="transcript">${t.segments.length ? t.segments.map((s) =>
          `<p><button type="button" class="linkish ts" data-at="${s[0]}" title="Слушать с этого места">${dur(Math.floor(s[0]))}</button> ${esc(s[2])}</p>`).join("") : `<p class="muted">Речь не распознана</p>`}</div>
          <div class="muted small">Расшифровка автоматическая: возможны ошибки в отдельных словах, реплики собеседников не разделены.</div>`;
        row.querySelectorAll("[data-at]").forEach((b) => b.addEventListener("click", () => player(btn.dataset.text, +b.dataset.at)));
      } catch (e) { if (e.message !== "auth") row.firstElementChild.innerHTML = `<div style="color:var(--bad)">${esc(e.message)}</div>`; }
    }));
    const lg = document.getElementById("cLog");
    if (lg) lg.addEventListener("toggle", () => { if (lg.open !== !!state.cLogOpen) { state.cLogOpen = lg.open; if (lg.open && !log) loadCalls(); } });
    const lf = document.getElementById("cLogForm");
    if (lf) lf.addEventListener("submit", (ev) => { ev.preventDefault(); state.cLogFrom = document.getElementById("cLogFrom").value; state.cLogTo = document.getElementById("cLogTo").value; loadCalls(); });
  }

  // ---------- воронка сделок
  const money = (v) => {
    if (v == null) return "—";
    const a = Math.abs(v);
    if (a >= 1e9) return nf(v / 1e9, 2) + " млрд ₽";
    if (a >= 1e6) return nf(v / 1e6, 1) + " млн ₽";
    if (a >= 1e3) return nf(v / 1e3, 0) + " тыс ₽";
    return nf(v) + " ₽";
  };
  function roundedPath(pts, r) {
    const n = pts.length, seg = [];
    for (let i = 0; i < n; i++) {
      const p = pts[i], a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
      const da = Math.hypot(a[0] - p[0], a[1] - p[1]), db = Math.hypot(b[0] - p[0], b[1] - p[1]);
      const ra = Math.min(r, da / 2), rb = Math.min(r, db / 2);
      const A = [p[0] + ((a[0] - p[0]) * ra) / da, p[1] + ((a[1] - p[1]) * ra) / da];
      const B = [p[0] + ((b[0] - p[0]) * rb) / db, p[1] + ((b[1] - p[1]) * rb) / db];
      seg.push(`${i ? "L" : "M"}${A[0].toFixed(1)} ${A[1].toFixed(1)} Q${p[0]} ${p[1]} ${B[0].toFixed(1)} ${B[1].toFixed(1)}`);
    }
    return seg.join(" ") + " Z";
  }
  // цвет этапа: от светло-лавандового (нет суммы) до фирменного индиго (наибольшая сумма); t — 0..1
  const toneColor = (t) => `color-mix(in srgb, var(--funnel) ${Math.round(14 + 86 * Math.max(0, Math.min(1, t || 0)))}%, var(--funnel-soft))`;
  // доля по логарифмической шкале: суммы этапов различаются на порядки (сотни тысяч и десятки миллиардов)
  const logShare = (v, max) => (v > 0 && max > 0 ? Math.log10(1 + v) / Math.log10(1 + max) : 0);
  function funnelShape(i, n, tone) {
    // форма как в образце: широкий верх, каждая следующая секция уже, последняя сходится в скруглённое остриё
    const W = 320, H = 78, cx = W / 2, step = (W - 120) / Math.max(1, n - 1);
    const top = W - 4 - i * step, last = i === n - 1;
    const bottom = last ? 8 : top - step * 0.78;
    const pts = [[cx - top / 2, 1], [cx + top / 2, 1], [cx + bottom / 2, H - 1], [cx - bottom / 2, H - 1]];
    return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${roundedPath(pts, last ? 14 : 11)}" style="fill:${toneColor(tone)}" stroke="var(--funnel)" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
  }
  function hbars(list, valueKey, labelFn, withAmount) {
    const mx = Math.max(1, ...list.map((x) => x[valueKey]));
    return `<div class="hbars">${list.map((x) => `<div class="hbar"><div class="nm">${labelFn(x)}</div>
      <div class="tr"><i style="width:${Math.max(1.5, (x[valueKey] / mx) * 100)}%"></i></div>
      <div class="v">${nf(x.count)} шт${withAmount ? ` · ${money(x.amount)}` : ""}</div></div>`).join("")}</div>`;
  }
  // две воронки на одной вкладке: лиды и сделки; d = { leads, deals } — ответы /api/funnel
  const FUNNELS = [
    { kind: "leads", title: "Лиды", gen: "лидов", one: "Лид", stage: "Статус" },
    { kind: "deals", title: "Сделки", gen: "сделок", one: "Сделка", stage: "Стадия" },
  ];
  // период на вкладке «Воронки»: state.fPer = { mode: all | day | month | year | range, day, month, year, from, to }
  const pad2 = (n) => String(n).padStart(2, "0");
  const isoDay = (x) => `${x.getFullYear()}-${pad2(x.getMonth() + 1)}-${pad2(x.getDate())}`;
  const ruDay = (v) => v.split("-").reverse().join(".");
  // ---------- выбор периода (воронки, звонки): всё время, день, месяц, год, с … по …
  const PERIOD_MODES = [["all", "Всё время"], ["day", "День"], ["month", "Месяц"], ["year", "Год"], ["range", "С … по …"]];
  function periodHtml(per, pfx) {  // поля выбора периода; id — pfx + Mode/Day/Month/Year/From/To
    return `<label for="${pfx}Mode">Период<select id="${pfx}Mode">${PERIOD_MODES.map(([v, t]) => `<option value="${v}" ${per.mode === v ? "selected" : ""}>${t}</option>`).join("")}</select></label>
          ${per.mode === "day" ? `<input type="date" id="${pfx}Day" aria-label="День" value="${esc(per.day || "")}">` : ""}
          ${per.mode === "month" ? `<input type="month" id="${pfx}Month" aria-label="Месяц" value="${esc(per.month || "")}">` : ""}
          ${per.mode === "year" ? `<input type="number" id="${pfx}Year" aria-label="Год" min="2000" max="2100" step="1" style="width:90px" value="${esc(String(per.year || ""))}">` : ""}
          ${per.mode === "range" ? `<label for="${pfx}From">с<input type="date" id="${pfx}From" value="${esc(per.from || "")}"></label><label for="${pfx}To">по<input type="date" id="${pfx}To" value="${esc(per.to || "")}"></label>` : ""}`;
  }
  function bindPeriod(pfx, get, set, reload) {
    const on = (id, fn) => { const el = document.getElementById(pfx + id); if (el) el.addEventListener("change", () => { fn(el.value); reload(); }); };
    on("Mode", (v) => {
      const t = new Date(), p = get() || {};
      set({ ...p, mode: v, day: p.day || isoDay(t), month: p.month || isoDay(t).slice(0, 7), year: p.year || t.getFullYear(),
            from: p.from || isoDay(t).slice(0, 8) + "01", to: p.to || isoDay(t) });
    });
    on("Day", (v) => { get().day = v; });
    on("Month", (v) => { get().month = v; });
    on("Year", (v) => { get().year = v; });
    on("From", (v) => { get().from = v; });
    on("To", (v) => { get().to = v; });
  }
  const periodLabel = (a, b) => !(a || b) ? "всё время" : a && a === b ? ruDay(a) : `${a ? "с " + ruDay(a) : ""}${b ? " по " + ruDay(b) : ""}`.trim();
  function funnelPeriod() { return periodRange(state.fPer || { mode: "all" }); }
  function periodRange(p) {  // [с, по] в формате ГГГГ-ММ-ДД; пустая строка — без границы
    if (p.mode === "day" && p.day) return [p.day, p.day];
    if (p.mode === "month" && /^\d{4}-\d{2}$/.test(p.month || "")) {
      const [y, m] = p.month.split("-").map(Number);
      return [`${p.month}-01`, `${p.month}-${pad2(new Date(y, m, 0).getDate())}`];
    }
    if (p.mode === "year" && /^\d{4}$/.test(String(p.year || ""))) return [`${p.year}-01-01`, `${p.year}-12-31`];
    if (p.mode === "range") {
      const a = p.from || "", b = p.to || "";
      return a && b && a > b ? [b, a] : [a, b];
    }
    return ["", ""];
  }
  document.addEventListener("click", (e) => {  // список ответственных закрывается по клику мимо него
    const det = document.getElementById("fResp");
    if (det && det.open && !det.contains(e.target)) { det.open = false; state.fRespOpen = false; }
  });
  function renderFunnel(d) {
    state.fData = d;
    const main = document.getElementById("main");
    if (!d[state.fKind]) state.fKind = "leads";
    const bars = state.fView === "bars";
    const K = FUNNELS.find((x) => x.kind === state.fKind);
    const f = d[K.kind], secs = f.sections, sel = Math.min(state.fSel || 0, secs.length - 1), cur = secs[sel];
    const hasAmount = (x) => x.sections.some((s) => s.amount);
    const snapRaw = d.deals.snapshot || d.leads.snapshot;
    const snap = snapRaw ? snapRaw.replace("T", " ").slice(0, 16).split(" ") : null;
    const snapTxt = snap ? ruDay(snap[0]) + " " + snap[1] : "—";

    // --- фильтры: период, ответственные (несколько), воронка сделок
    const per = state.fPer || { mode: "all" }, [dFrom, dTo] = funnelPeriod(), byStage = state.fDateField === "stage";
    const perHtml = PREVIEW ? "" : `${periodHtml(per, "f")}
          ${per.mode !== "all" ? `<label for="fField">по дате<select id="fField"><option value="created" ${byStage ? "" : "selected"}>создания</option><option value="stage" ${byStage ? "selected" : ""}>перехода на стадию</option></select></label>` : ""}`;
    const perRange = dFrom && dFrom === dTo ? ruDay(dFrom) : `${dFrom ? "с " + ruDay(dFrom) : ""}${dTo ? " по " + ruDay(dTo) : ""}`.trim();
    const perTxt = !(dFrom || dTo) ? "" : ` Показаны открытые сейчас записи с датой ${byStage ? "перехода на текущую стадию" : "создания"} ${perRange}.`;
    const resp = new Map();  // ответственные из обеих воронок в одном списке
    FUNNELS.forEach((x) => d[x.kind].filters.responsibles.forEach((r) => {
      const o = resp.get(r.value) || { value: r.value, name: r.name, count: 0 };
      o.count += r.count; resp.set(r.value, o);
    }));
    state.fRespNames = new Map([...resp.values()].map((r) => [r.value, r.name]));
    const respList = [...resp.values()].sort((a, b) => a.name.localeCompare(b.name, "ru"));
    const chosen = (state.fLogins || []).filter((v) => resp.has(v));
    const chosenNames = chosen.map((v) => resp.get(v).name);
    const respLabel = !chosen.length ? "Все" : chosen.length === 1 ? chosenNames[0] : `Выбрано: ${chosen.length}`;
    const cats = d.deals.filters.categories, catName = (cats.find((c) => c.value === d.deals.applied.category) || {}).name;

    // --- графика: ширина (длина) — количество, насыщенность цвета и толщина полосы — сумма
    const panel = (x) => {
      const fx = d[x.kind], amt = hasAmount(fx), ss = fx.sections;
      const maxC = Math.max(1, ...ss.map((s) => s.count)), maxA = Math.max(1, ...ss.map((s) => s.amount || 0));
      const w = ss.map((s) => s.count / maxC), tone = ss.map((s) => (amt ? logShare(s.amount || 0, maxA) : s.count / maxC));
      const shape = (i) => bars
        ? `<div class="fn-bar"><i style="width:${Math.max(1.5, w[i] * 100)}%;height:${amt ? Math.round(12 + 30 * tone[i]) : 28}px;background:${toneColor(tone[i])}"></i></div>`
        : `<div class="fn-shape">${funnelShape(i, ss.length, tone[i])}</div>`;
      return `<section class="panel"><div class="panel-h"><h2>${x.title}</h2><span class="muted small">${nf(fx.total)} ${x.gen} в воронке</span></div>
        <div class="fn" role="list">
        ${ss.map((s, i) => `<div class="fn-row ${x.kind === K.kind && i === sel ? "sel" : ""}" role="listitem" tabindex="0" data-kind="${x.kind}" data-sec="${i}" aria-label="${x.title}, ${esc(s.title)}: ${s.count}">
          ${shape(i)}
          <div class="fn-lab"><span class="t">${esc(s.title)}</span><span class="c">${nf(s.count)}</span>
            ${amt ? `<span class="a">${money(s.amount)}</span>` : ""}
            <span class="h">${s.share_of_total != null ? `${pct(s.share_of_total, 1)} воронки` : ""}${s.avg_days_on_stage != null ? ` · в среднем ${nf(s.avg_days_on_stage)} дн. на стадии` : ""}</span></div>
        </div>`).join("")}
        </div>
        <div class="fn-legend"><span class="fn-scale"></span><span>${bars ? "Длина полосы — количество. " : ""}${amt ? `Цвет${bars ? " и толщина" : ""} — сумма: чем темнее, тем больше. Шкала логарифмическая: видна разница и между тысячами, и между миллиардами` : "Цвет — количество: чем темнее, тем больше"}.</span></div></section>`;
    };

    // --- документ для печати: параметры отчёта, затем по каждой воронке графика и таблицы
    const printFunnel = (x) => {
      const fx = d[x.kind], amt = hasAmount(fx), ss = fx.sections, many = fx.filters.categories.length > 1;
      const total = fx.total_amount ?? ss.reduce((a, s) => a + (s.amount || 0), 0);
      const people = new Map();
      ss.forEach((s, i) => s.by_responsible.forEach((r) => {
        const o = people.get(r.value) || { name: r.name, cells: ss.map(() => null), count: 0, amount: 0 };
        o.cells[i] = r; o.count += r.count; o.amount += r.amount || 0; people.set(r.value, o);
      }));
      const ppl = [...people.values()].sort((a, b) => b.count - a.count);
      const cell = (r) => (r ? `${nf(r.count)}${amt && r.amount ? `<br><span class="sm">${money(r.amount)}</span>` : ""}` : "—");
      return `<section class="pr-sec"><h2>${x.title}: ${nf(fx.total)} ${x.gen}${amt ? ` на ${money(total)}` : ""}</h2>
        ${panel(x)}
        <h3>Этапы воронки</h3>
        <table class="pr"><thead><tr><th>Этап</th><th>${x.kind === "leads" ? "Статусы" : "Стадии"} CRM</th><th class="n">Количество</th>${amt ? `<th class="n">Сумма, ₽</th>` : ""}<th class="n">Доля воронки</th><th class="n">Дней на стадии, в среднем</th></tr></thead><tbody>
          ${ss.map((s) => `<tr><td><b>${esc(s.title)}</b></td><td>${s.by_stage.map((b) => `${esc(b.stage)}${many ? ` (${esc(b.category)})` : ""} — ${nf(b.count)}`).join("<br>") || "—"}</td>
            <td class="n">${nf(s.count)}</td>${amt ? `<td class="n">${nf(s.amount)}</td>` : ""}<td class="n">${s.share_of_total != null ? pct(s.share_of_total, 1) : "—"}</td><td class="n">${s.avg_days_on_stage ?? "—"}</td></tr>`).join("")}
          <tr class="tot"><td colspan="2">Итого в воронке</td><td class="n">${nf(fx.total)}</td>${amt ? `<td class="n">${nf(total)}</td>` : ""}<td></td><td></td></tr>
        </tbody></table>
        <h3>По ответственным</h3>
        ${ppl.length ? `<table class="pr"><thead><tr><th>Ответственный</th>${ss.map((s) => `<th class="n">${esc(s.title)}</th>`).join("")}<th class="n">Всего</th></tr></thead><tbody>
          ${ppl.map((p) => `<tr><td>${esc(p.name)}</td>${p.cells.map((r) => `<td class="n">${cell(r)}</td>`).join("")}<td class="n"><b>${cell(p)}</b></td></tr>`).join("")}
        </tbody></table>` : `<p>Записей нет.</p>`}
        ${fx.other_stages.length ? `<p class="sm">Не вошли в этапы воронки: ${fx.other_stages.map((o) => `${esc(o.stage)}${many ? ` (${esc(o.category)})` : ""} — ${nf(o.count)}`).join("; ")}.</p>` : ""}
      </section>`;
    };
    // --- звонки выбранных ответственных: воронка отбора результативных звонков, как в карточке KPI
    const cf = d.calls, cfPeople = cf ? cf.people.filter(Boolean) : [];
    const cfPer = !cf ? "" : (cf.date_from === cf.date_to ? ruDay(cf.date_from) : `${ruDay(cf.date_from)} – ${ruDay(cf.date_to)}`) +
      (dFrom || dTo ? "" : " (период не выбран — текущий месяц)");
    const cfBlock = (p) => {
      const name = p.name || (state.fRespNames && state.fRespNames.get(p.login)) || p.login;

    const now = new Date();
    const printHtml = `<div class="print-only">
      <div class="pr-head"><h1>Воронки лидов и сделок</h1>
        <table class="pr pr-params"><tbody>
          <tr><th>Данные Битрикс24 на</th><td>${esc(snapTxt)}</td></tr>
          <tr><th>Период</th><td>${dFrom || dTo ? `${byStage ? "дата перехода на текущую стадию" : "дата создания"} ${esc(perRange)}` : "всё время"}; учитываются открытые сейчас лиды и сделки</td></tr>
          <tr><th>Ответственные</th><td>${chosen.length ? esc(chosenNames.join(", ")) : "все"}</td></tr>
          <tr><th>Воронка сделок</th><td>${catName ? esc(catName) : "все"}</td></tr>
          <tr><th>Отчёт сформирован</th><td>${ruDay(isoDay(now))} ${pad2(now.getHours())}:${pad2(now.getMinutes())}, ${esc(state.boot.me.name)}</td></tr>
        </tbody></table></div>
      <div id="fCalPrint">${calPrintHtml()}</div>
      ${cfHtml ? `<section class="pr-sec"><h2>Звонки: как отбираются результативные, ${esc(cfPer)}</h2><div class="cf-grid">${cfHtml}</div></section>` : ""}
      ${FUNNELS.map(printFunnel).join("")}</div>`;

    const amt = hasAmount(f), manyCats = f.filters.categories.length > 1;
    const other = FUNNELS.filter((x) => d[x.kind].other_stages.length);
    main.innerHTML = `
      <div class="head no-print"><div><div class="eyebrow">Битрикс24 · CRM</div><h1>Воронки лидов и сделок</h1>
        <div class="sub">Текущее состояние открытых лидов и сделок на ${esc(snapTxt)}. Обновляется при каждой синхронизации с Битрикс24.${esc(perTxt)}${!chosen.length && !PREVIEW ? " Выберите ответственного — рядом появится его расписание из календаря Битрикс24 на последний день периода." : ""}</div></div>
        <div class="filters">
          ${perHtml}
          <div class="msel-wrap"><span>Ответственные</span><details class="msel" id="fResp" ${state.fRespOpen ? "open" : ""}><summary>${esc(respLabel)}</summary>
            <div class="msel-pop">${respList.map((r) => `<label><input type="checkbox" value="${esc(r.value)}" ${chosen.includes(r.value) ? "checked" : ""}>${esc(r.name)} <span class="muted">(${r.count})</span></label>`).join("")}
              <button type="button" class="linkish" id="fRespClear">Сбросить выбор</button></div></details></div>
          <label for="fCat">Воронка сделок<select id="fCat"><option value="">Все</option>${cats.map((c) => `<option value="${esc(c.value)}" ${d.deals.applied.category === c.value ? "selected" : ""}>${esc(c.name)} (${c.count})</option>`).join("")}</select></label>
          <nav class="tabs" aria-label="Вид"><a href="#funnel" data-fview="funnel" class="${bars ? "" : "on"}">Воронка</a><a href="#funnel" data-fview="bars" class="${bars ? "on" : ""}">Диаграмма</a></nav>
          <button class="btn" id="fPrintBtn" type="button">Печать</button>
        </div></div>
      <div class="fn-layout no-print ${chosen.length && !PREVIEW ? "with-cal" : ""}">
        <div class="fn2">${FUNNELS.map(panel).join("")}</div>
        ${chosen.length && !PREVIEW ? `<aside id="fCal" aria-label="Расписание из календаря Битрикс24">${calHtml()}</aside>` : ""}</div>
      ${cfHtml ? `<section class="panel no-print"><div class="panel-h"><div><div class="eyebrow">Битрикс24 · телефония</div><h2>Звонки: как отбираются результативные</h2></div>
        <span class="muted small">${esc(cfPer)}</span></div><div class="panel-b cf-grid">${cfHtml}</div></section>` : ""}
      <section class="panel no-print"><div class="panel-h"><div><div class="eyebrow">${K.title} · этап воронки</div><h2>${esc(cur.title)}: ${nf(cur.count)}${amt ? ` · ${money(cur.amount)}` : ""}</h2></div>
        <span class="muted small">${esc(cur.rule)}</span></div>
        <div class="panel-b" style="display:flex;flex-direction:column;gap:16px">
          ${cur.count ? `<div class="split">
            <div><div class="eyebrow" style="margin-bottom:8px">По стадиям</div>${hbars(cur.by_stage, "count", (x) => `${esc(x.stage)}${manyCats ? ` <small>· ${esc(x.category)}</small>` : ""}`, amt)}</div>
            <div><div class="eyebrow" style="margin-bottom:8px">По ответственным</div>${hbars(cur.by_responsible, amt ? "amount" : "count", (x) => `<button type="button" class="linkish" data-resp="${esc(x.value)}" title="Показать воронки только этого сотрудника">${esc(x.name)}</button>`, amt)}</div>
          </div>
          <div class="dt-wrap" style="max-height:420px"><table class="dt"><thead><tr><th>${K.one}</th><th>Клиент</th><th>Ответственный</th>${manyCats ? "<th>Воронка</th>" : ""}<th>${K.stage}</th>${amt ? "<th>Сумма, ₽</th>" : ""}<th>Дней на стадии</th></tr></thead><tbody>
            ${cur.deals.slice(0, 150).map((r) => `<tr><td>${esc(r.title)}</td><td>${esc(r.client)}</td><td>${esc(r.responsible)}</td>${manyCats ? `<td>${esc(r.category)}</td>` : ""}<td>${esc(r.stage)}</td>
              ${amt ? `<td class="n">${nf(r.amount)}</td>` : ""}<td class="n">${r.days ?? "—"}</td></tr>`).join("")}</tbody></table></div>
          ${cur.deals.length > 150 ? `<div class="muted small">Показаны первые 150 из ${cur.deals.length}.</div>` : ""}` : `<div class="muted">На этом этапе сейчас ничего нет.</div>`}
        </div></section>
      ${other.map((x) => `<details class="panel more no-print" style="border-top:0"><summary>${x.title}: стадии вне этапов воронки · ${d[x.kind].other_stages.length}</summary><div class="more-b">
        <div class="desc">Записи на этих стадиях не попали ни в один этап, заданный списком стадий. Чтобы учесть стадию, добавьте её название в config.json → ${d[x.kind].config_key} → sections.</div>
        <div class="hbars">${d[x.kind].other_stages.map((o) => `<div class="hbar"><div class="nm">${esc(o.stage)}${x.kind === "deals" ? ` <small>· ${esc(o.category)}</small>` : ""}</div><div></div><div class="v">${nf(o.count)} шт</div></div>`).join("")}</div>
      </div></details>`).join("")}
      ${printHtml}`;

    main.querySelectorAll(".no-print [data-sec]").forEach((row) => {
      const pick = () => { state.fKind = row.dataset.kind; state.fSel = +row.dataset.sec; renderFunnel(state.fData); };
      row.addEventListener("click", pick);
      row.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
    });
    const onChange = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener("change", () => { fn(el.value); load(); }); };
    bindPeriod("f", () => state.fPer, (v) => { state.fPer = v; }, load);
    onChange("fField", (v) => { state.fDateField = v; });
    onChange("fCat", (v) => { state.fCat = v; if (PREVIEW) state.fLogins = []; });

    det.addEventListener("toggle", () => { state.fRespOpen = det.open; });

    main.querySelectorAll("[data-resp]").forEach((b) => b.addEventListener("click", () => setLogins([b.dataset.resp], false)));
    main.querySelectorAll("[data-fview]").forEach((a) => a.addEventListener("click", (e) => {
      e.preventDefault(); state.fView = a.dataset.fview; renderFunnel(state.fData);
    }));
    document.getElementById("fPrintBtn").addEventListener("click", () => window.print());
    loadCalendar();

  // ---------- расписание из календаря Битрикс24 на последний день периода воронок
  function calDay() { const [, dTo] = funnelPeriod(); return dTo || isoDay(new Date()); }
  async function loadCalendar() {
    const logins = state.fLogins || [], day = calDay(), key = day + "|" + logins.join(",");
    if (PREVIEW || !logins.length) { state.fCal = null; return paintCal(); }
    if (state.fCal && state.fCal.key === key && !state.fCal.error) return paintCal();
    state.fCal = { key, loading: true }; paintCal();
    try {
      const data = await api(`/api/calendar?login=${encodeURIComponent(logins.join(","))}&date=${day}`);
      if (state.fCal && state.fCal.key === key) { state.fCal = { key, data }; paintCal(); }
    } catch (e) {
      if (e.message !== "auth" && state.fCal && state.fCal.key === key) { state.fCal = { key, error: e.message }; paintCal(); }
    }
  }
  function paintCal() {
    const el = document.getElementById("fCal"); if (el) el.innerHTML = calHtml();
    const pr = document.getElementById("fCalPrint"); if (pr) pr.innerHTML = calPrintHtml();
  }
  const calWhen = (x) => x.all_day ? "весь день" : x.from && x.to ? `${x.from}–${x.to}` : x.from ? `с ${x.from}` : `до ${x.to}`;
  function calPrintHtml() {  // расписание в печатной версии: все записи, без сворачивания
    const c = state.fCal;
    if (PREVIEW || !(state.fLogins || []).length || !c) return "";
    const title = `<h2>Расписание на ${esc(ruDay(calDay()))} (календарь Битрикс24)</h2>`;
    if (c.loading) return `<section class="pr-sec">${title}<p class="sm">Календарь ещё загружается — повторите печать через несколько секунд.</p></section>`;
    if (c.error || c.data.unavailable) return `<section class="pr-sec">${title}<p class="sm">${esc(c.error || c.data.unavailable)}</p></section>`;
    return `<section class="pr-sec">${title}${c.data.people.map((p) => {
      const name = (state.fRespNames && state.fRespNames.get(p.key)) || p.key;
      if (p.error) return `<h3>${esc(name)}</h3><p class="sm">${esc(p.error)}</p>`;
      return `<h3>${esc(name)}</h3>${p.items.length ? `<table class="pr"><thead><tr><th>Время</th><th>Что</th><th>Тип</th></tr></thead><tbody>
        ${p.items.map((x) => `<tr><td>${esc(calWhen(x))}</td><td>${esc(x.title)}</td><td>${x.kind === "task" ? `Задача · ${esc(x.role)} · ${esc(x.done ? "завершена" : x.status)}` : `Событие${x.location ? " · " + esc(x.location) : ""}`}</td></tr>`).join("")}
        </tbody></table>` : `<p class="sm">В этот день ничего не запланировано.</p>`}`;
    }).join("")}</section>`;
  }
  function calHtml() {
    if (PREVIEW) return "";
    const logins = state.fLogins || [], day = calDay(), c = state.fCal;
    const head = `<div class="panel-h"><div><div class="eyebrow">Календарь Битрикс24 · последний день периода</div><h2>Расписание на ${esc(ruDay(day))}</h2></div></div>`;
    if (!logins.length) return "";
    let body;
    if (!c || c.loading) body = `<div class="muted small">Загружаю календарь…</div>`;
    else if (c.error) body = `<div class="small" style="color:var(--bad)">${esc(c.error)}</div>`;
    else if (c.data.unavailable) body = `<div class="muted small">${esc(c.data.unavailable)}</div>`;
    else body = `<div class="cal-grid">${c.data.people.map((p) => {
      const name = (state.fRespNames && state.fRespNames.get(p.key)) || p.key;
      if (p.error) return `<div class="cal-person"><h3>${esc(name)}</h3><div class="small" style="color:var(--bad)">${esc(p.error)}</div></div>`;
      const li = (x) => `<li class="cal-item ${x.kind}${x.done ? " done" : ""}">
          <span class="cal-t">${esc(calWhen(x))}</span><i class="cal-m" aria-hidden="true"></i>
          <span class="cal-b"><span class="cal-n">${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>` : esc(x.title)}</span>
          <span class="cal-s">${x.kind === "task" ? `Задача · ${esc(x.role)} · ${esc(x.done ? "завершена" : x.status)}` : `Событие${x.location ? " · " + esc(x.location) : ""}`}</span></span></li>`;
      // задачи «на весь день» (в работе до срока) Б24 показывает каждый день — их сворачиваем, если их много
      const longTasks = p.items.filter((x) => x.kind === "task" && x.all_day);
      const fold = longTasks.length > 3;
      const main = fold ? p.items.filter((x) => !longTasks.includes(x)) : p.items;
      return `<div class="cal-person"><h3>${esc(name)}</h3>
        ${p.calendar_error ? `<div class="muted small">${p.calendar_error === "scope" ? "Нет доступа к событиям календаря: добавьте вебхуку право «Календарь». Показаны только задачи." : "События календаря не загрузились: " + esc(p.calendar_error)}</div>` : ""}
        ${main.length ? `<ul class="cal-list">${main.map(li).join("")}</ul>` : p.items.length ? `<div class="muted small">Событий и задач со сроком в этот день нет.</div>` : `<div class="muted small">В этот день ничего не запланировано.</div>`}
        ${fold ? `<details class="cal-more"><summary>Ещё задачи в работе на весь день: ${longTasks.length}</summary><ul class="cal-list">${longTasks.map(li).join("")}</ul></details>` : ""}</div>`;
    }).join("")}</div>`;
    return `<section class="panel cal">${head}<div class="panel-b">${body}</div></section>`;
  }

  // ---------- методика
  function showRules() {
    const b = state.boot;
    const own = b.me.role === "manager" ? Object.keys(b.positions) : b.employees.map((e) => e.position).filter(Boolean);
    const dr = document.createElement("div");
    dr.className = "drawer";
    dr.innerHTML = `<div role="dialog" aria-modal="true" aria-label="Методика расчёта KPI">
      <div class="head"><div><div class="eyebrow">Методика</div><h1>Правила расчёта KPI</h1></div><button class="btn" type="button" data-close>Закрыть</button></div>
      <p class="desc" style="margin:0">Правила взяты из регламентов KPI. Пункт с несколькими нормативами считается выполненным, когда выполнены все нормативы; процент выполнения пункта — по самому слабому из них.
      ${b.payout_mode === "binary" ? "Пункт оплачивается полностью при выполнении 100% норматива." : "Пункт оплачивается пропорционально выполнению."}</p>
      ${own.map((k) => { const p = b.positions[k]; return `<section style="display:flex;flex-direction:column;gap:10px"><div><div class="eyebrow">${esc(p.department)} · ${esc(p.doc || "")}</div><h2>${esc(p.title)}</h2>
        <div class="small muted">Оклад ${rub(p.salary)} + KPI ${rub(p.kpi_bonus)}</div></div>
        ${p.items.map((i) => `<div class="rule"><div class="w">${Math.round(i.weight * 100)}%</div><div><h3>KPI ${i.n}. ${esc(i.title)}</h3>
          <div class="small muted">${esc(i.period)} · ${esc(i.target_text)} · ${nf(p.kpi_bonus * i.weight)} ₽</div><p>${esc(i.description)}</p></div></div>`).join("")}</section>`; }).join("")}
    </div>`;
    document.body.appendChild(dr);
    const close = () => dr.remove();
    dr.addEventListener("click", (e) => { if (e.target === dr || e.target.hasAttribute("data-close")) close(); });
    document.addEventListener("keydown", function k(e) { if (e.key === "Escape") { close(); document.removeEventListener("keydown", k); } });
    dr.querySelector("[data-close]").focus();
  }

  function renderNoKpi(e, isMgr) {  // сотрудник без назначенного KPI
    document.getElementById("main").innerHTML = `
      <div class="head"><div><div class="eyebrow">${esc(e.department_title || "Без отдела")}${e.position_title ? " · " + esc(e.position_title) : ""}</div><h1>${esc(e.name)}</h1></div></div>
      <section class="panel"><div class="panel-b" style="padding-top:16px">
        <p style="margin:0 0 6px"><b>KPI не назначен.</b> ${isMgr ? "Пока у сотрудника нет KPI, по нему ничего не считается и не начисляется." : "Когда руководитель назначит вам KPI, здесь появится ваш дашборд."}</p>
        <p class="muted small" style="margin:0">${isMgr ? `Назначить KPI можно в разделе <a href="#staff">«Сотрудники»</a>.` : "Раздел «Воронки» доступен уже сейчас."}</p>
      </div></section>`;

  // ---------- сотрудники (только администратор)

    const depTitle = (k) => (d.departments.find((x) => x.key === k) || {}).title || k || "—";
    const editing = editLogin === "" ? {} : d.employees.find((e) => e.login === editLogin);
    const surname = (s) => (s || "").trim().split(/\s+/);
    main.innerHTML = `
      <div class="head"><div><div class="eyebrow">Администрирование</div><h1>Сотрудники</h1>
        <div class="sub">Кто входит в дашборд, чей KPI считается и кто видит всю команду</div></div>
        <button class="btn primary" type="button" id="addEmp">+ Добавить сотрудника</button></div>
      ${editing ? `<section class="panel" id="empFormPanel"><div class="panel-h"><h2>${editing.login ? esc(editing.name) : "Новый сотрудник"}</h2></div>
        <div class="panel-b">${staffForm(d, editing)}</div></section>` : ""}
      <section class="panel"><div class="panel-h"><h2>Все пользователи</h2><span class="muted small">${d.employees.length}</span></div>
        <div class="scroll"><table class="staff-list"><thead><tr><th>Имя и фамилия</th><th>Отдел</th><th>Должность</th><th>KPI</th>
          <th>Б24 ID</th><th>Видимость</th><th>Администратор</th><th>Логин</th><th>Пароль</th></tr></thead><tbody>
          ${d.employees.map((e) => `<tr tabindex="0" data-edit="${esc(e.login)}" class="${editing && editing.login === e.login ? "sel" : ""}">
            <td>${esc(e.name)}${e.onec_manager && surname(e.onec_manager)[0] !== surname(e.name).slice(-1)[0] ? `<div class="muted small">в 1С: ${esc(e.onec_manager)}</div>` : ""}${awayNow(d, e)}</td>
            <td>${esc(depTitle(e.department))}</td><td>${esc(e.title || "—")}</td><td>${esc(e.position ? posTitle(e.position) : "—")}</td>
            <td class="nw">${e.b24_user_id || "—"}</td>

            <td>${e.admin ? "Да" : e.listen_dept ? `<span class="muted small">звонки отдела</span>` : "—"}</td><td class="nw">${esc(e.login)}</td>
            <td>${e.has_password ? "задан" : `<span style="color:var(--bad)">не задан</span>`}</td></tr>`).join("")}
        </tbody></table></div>
        <div class="panel-b muted small">Открытый — сотрудник виден в «KPI сотрудников», и его KPI считается, если KPI выбран. Закрытый — не виден (например, руководитель без своего KPI). Администратор видит всю команду, ставит оценки, слушает все звонки и управляет этим списком. «Слушает звонки своего отдела» — доступ к записям звонков коллег по отделу (без доступа к их KPI). Нажмите на строку, чтобы изменить сотрудника.</div></section>`;
    document.getElementById("addEmp").addEventListener("click", () => { renderStaff(d, ""); document.getElementById("f_name").focus(); });
    main.querySelectorAll("[data-edit]").forEach((tr) => {
      const open = () => { renderStaff(d, tr.dataset.edit); window.scrollTo(0, 0); };
      tr.addEventListener("click", open);
      tr.addEventListener("keydown", (ev) => { if (ev.key === "Enter") open(); });
    });

  function staffForm(d, e) {
    const isNew = !e.login;
    const deps = d.departments.map((x) => `<option value="${esc(x.key)}" ${x.key === e.department ? "selected" : ""}>${esc(x.title)}</option>`).join("");
    return `<form id="empForm" novalidate><div class="staff-form">
      <label for="f_name">Имя и фамилия<input id="f_name" type="text" maxlength="100" value="${esc(e.name || "")}" required></label>
      <label for="f_dep">Отдел<select id="f_dep"><option value="">— не указан —</option>${deps}<option value="__new">Новый отдел…</option></select></label>
      <label for="f_dep_new" id="f_dep_new_l" hidden>Название нового отдела<input id="f_dep_new" type="text" maxlength="60"></label>
      <label for="f_title">Должность<input id="f_title" type="text" maxlength="100" value="${esc(e.title || "")}"></label>
      <label for="f_b24">ID в Битрикс24<input id="f_b24" type="text" inputmode="url" value="${e.b24_user_id || ""}" placeholder="56 или ссылка на карточку">
        <span class="hint">Число или ссылка вида …/company/personal/user/56/</span></label>
      <label for="f_onec">ФИО в 1С<input id="f_onec" type="text" maxlength="150" value="${esc(e.onec_manager || "")}" placeholder="Фамилия Имя Отчество">
        <span class="hint">Как сотрудник записан менеджером или ответственным в 1С</span></label>
      <label for="f_pos">KPI<select id="f_pos"><option value="">— без KPI —</option>${d.positions.map((p) => `<option value="${esc(p.key)}" ${p.key === e.position ? "selected" : ""}>${esc(p.title)}</option>`).join("")}</select>
        <span class="hint">Регламент, по которому считается KPI. Можно оставить без KPI</span></label>
      <fieldset><legend>Видимость</legend><div class="opts">
        <label for="f_vis1"><input id="f_vis1" type="radio" name="vis" value="1" ${e.visible !== false ? "checked" : ""}>Открытый</label>
        <label for="f_vis0"><input id="f_vis0" type="radio" name="vis" value="0" ${e.visible === false ? "checked" : ""}>Закрытый</label></div></fieldset>
      <fieldset><legend>Права</legend><div class="opts">
        <label for="f_admin"><input id="f_admin" type="checkbox" ${e.admin ? "checked" : ""}>Администратор</label>
        <label for="f_listen"><input id="f_listen" type="checkbox" ${e.listen_dept ? "checked" : ""}>Слушает звонки своего отдела</label></div>
        <span class="hint">Записи звонков сотрудников с тем же отделом. Администратор слушает все звонки</span></fieldset>
      <label for="f_login">Логин<input id="f_login" type="text" maxlength="32" autocomplete="off" value="${esc(e.login || "")}" ${isNew ? "" : "readonly"}>
        <span class="hint">${isNew ? "Латинские буквы, цифры, точка, дефис" : "Логин после создания не меняется"}</span></label>
      <label for="f_pwd">Пароль<input id="f_pwd" type="password" autocomplete="new-password" placeholder="${isNew ? "не короче 6 символов" : "оставьте пустым, чтобы не менять"}"></label>
    </div>
    <fieldset class="absences"><legend>Отсутствия</legend>
      <div class="hint">Больничный, отпуск, декрет и «отпросился(-лась)» освобождают от норм на эти дни; месяц, где сотрудник не работал ни дня, не оценивается. Прогул от норм не освобождает.</div>
      <div id="absRows">${(e.absences || []).map((a, i) => absRow(d, a, i)).join("")}</div>
      <div><button class="btn" type="button" id="absAdd">+ Добавить период</button></div></fieldset>
    <div class="staff-actions"><button class="btn primary" type="submit">${isNew ? "Добавить" : "Сохранить"}</button>
      <button class="btn" type="button" id="empCancel">Отмена</button>
      ${isNew || e.login === state.boot.me.login ? "" : `<button class="btn danger" type="button" id="empDelete">Удалить</button>`}
      <span class="err" id="empErr" role="alert"></span></div></form>`;
  }

  function awayNow(d, e) {  // «Сейчас: Отпуск до 20.10» в списке сотрудников
    const t = new Date(), iso = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
    const a = (e.absences || []).find((x) => x.from <= iso && iso <= (x.to || x.from));
    if (!a) return "";
    const kind = (d.absence_kinds.find((k) => k.key === a.kind) || {}).title || "Отсутствие";
    return `<div class="small away">Сейчас: ${esc(kind)} до ${a.to.slice(8, 10)}.${a.to.slice(5, 7)}</div>`;
  }

  let absSeq = 0;
  function absRow(d, a, i) {  // строка периода отсутствия в форме сотрудника
    const n = "a" + absSeq++;
    return `<div class="abs-row" data-abs>
      <label for="${n}f">С<input id="${n}f" type="date" data-k="from" value="${esc(a.from || "")}"></label>
      <label for="${n}t">По<input id="${n}t" type="date" data-k="to" value="${esc(a.to || "")}"></label>
      <label for="${n}k">Категория<select id="${n}k" data-k="kind"><option value="">— выберите —</option>
        ${d.absence_kinds.map((k) => `<option value="${k.key}" ${k.key === a.kind ? "selected" : ""}>${esc(k.title)}</option>`).join("")}</select></label>
      <label for="${n}r" class="grow">Комментарий<input id="${n}r" type="text" maxlength="200" data-k="reason" value="${esc(a.reason || "")}"></label>
      <button class="btn ghost" type="button" data-abs-del aria-label="Убрать период">Убрать</button></div>`;
  }

  function bindStaffForm(d, e) {
    const isNew = !e.login, $ = (id) => document.getElementById(id);
    const rows = $("absRows");
    $("absAdd").addEventListener("click", () => {
      rows.insertAdjacentHTML("beforeend", absRow(d, {}, rows.children.length));
      rows.lastElementChild.querySelector("input").focus();
    });
    rows.addEventListener("click", (ev) => { const b = ev.target.closest("[data-abs-del]"); if (b) b.closest("[data-abs]").remove(); });
    const absences = () => [...rows.querySelectorAll("[data-abs]")].map((r) =>
      Object.fromEntries([...r.querySelectorAll("[data-k]")].map((x) => [x.dataset.k, x.value])));
    const dep = $("f_dep");
    dep.addEventListener("change", () => { $("f_dep_new_l").hidden = dep.value !== "__new"; if (dep.value === "__new") $("f_dep_new").focus(); });
    $("f_pos").addEventListener("change", () => {  // подсказать должность и отдел по выбранному KPI
      const p = d.positions.find((x) => x.key === $("f_pos").value);
      if (!p) return;
      if (!$("f_title").value.trim()) $("f_title").value = p.title;
      if (!dep.value) dep.value = p.department;
    });
    $("empCancel").addEventListener("click", () => renderStaff(d));
    const del = $("empDelete");
    if (del) del.addEventListener("click", async () => {
      if (!del.classList.contains("armed")) { del.classList.add("armed"); del.textContent = "Точно удалить? Нажмите ещё раз"; return; }
      try { renderStaff(await api("/api/staff", { action: "delete", login: e.login })); toast(`${e.name} — удалён(а) из дашборда`); refreshBoot(); }
      catch (err) { if (err.message !== "auth") $("empErr").textContent = err.message; }
    });
    $("empForm").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const body = {
        action: isNew ? "create" : "update", login: $("f_login").value.trim().toLowerCase(), name: $("f_name").value,
        department: dep.value === "__new" ? $("f_dep_new").value : dep.value, title: $("f_title").value,
        b24_user_id: $("f_b24").value, onec_manager: $("f_onec").value, position: $("f_pos").value,
        visible: $("f_vis1").checked, admin: $("f_admin").checked, listen_dept: $("f_listen").checked, password: $("f_pwd").value, absences: absences(),
      };
      try {
        renderStaff(await api("/api/staff", body));
        toast(isNew ? "Сотрудник добавлен. Его данные из Битрикс24 и 1С появятся после «Обновить данные»" : "Изменения сохранены");
        refreshBoot();
      } catch (err) { if (err.message !== "auth") $("empErr").textContent = err.message; }
    });
  }

  async function refreshBoot() {  // обновить список сотрудников в меню и кэш KPI команды
    try { state.boot = await api("/api/bootstrap"); sideCache = {}; } catch (e) { /* покажется при следующей загрузке */ }
  }

  window.addEventListener("hashchange", () => {
    if (!state.boot) return;
    const h = location.hash.replace("#", "");
    if (state.boot.me.role !== "manager") {
      const view = h === "funnel" ? "funnel" : "emp";
      if (view !== state.view) { state.view = view; renderShell(); load(); }
      return;
    }
    if (h.startsWith("emp-") && h.slice(4) !== state.login) { state.view = "emp"; state.login = h.slice(4); load(); }
    else if (h === "team" && state.view !== "team") { state.view = "team"; renderShell(); load(); }
    else if (h === "funnel" && state.view !== "funnel") { state.view = "funnel"; renderShell(); load(); }
    else if (h === "staff" && state.view !== "staff") { state.view = "staff"; renderShell(); load(); }
  });
  start();
})();
</script>
