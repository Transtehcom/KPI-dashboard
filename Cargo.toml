[package]
name = "ttk-dashboard-site"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
base64 = "0.22"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.2"
tiny_http = "0.12"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

